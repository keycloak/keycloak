referralHelp=Especifica se as referências LDAP devem ser seguidas ou ignoradas. Observe que a ativação de referências pode retardar a autenticação, pois permite que o servidor LDAP decida quais outros servidores LDAP usar. Isso poderia incluir servidores não confiáveis.
authenticatorRefConfig.value.help=Adicione um nome de referência personalizado para o autenticador. Quando esse autenticador for concluído com êxito durante um fluxo de autenticação, o mapeador de protocolo Authentication Method Reference (AMR) usará esse valor para preencher a declaração amr dos tokens gerados. Observe que o protocolo AMR deve ser configurado para que o cliente determinado preencha a declaração AMR.
authenticatorRefConfig.value.label=Referência do autenticador
authenticatorRefConfig.maxAge.help=A duração máxima em segundos para a qual o valor de referência do autenticador é válido em uma sessão SSO. Quando o mapeador de protocolo Authentication Method Reference (AMR) for usado, o AMR só será considerado válido e preenchido no token se a execução do autenticador tiver sido concluída dentro da idade máxima especificada.
authenticatorRefConfig.maxAge.label=Idade máxima de referência do autenticador
loa-condition-level=Nível de autenticação (LoA)
loa-condition-level.tooltip=Nível de autenticação. Este valor deve ser sempre inteiro, que é maior ou igual a 0. Os subfluxos no fluxo de autenticação devem ser sempre ordenados dos níveis mais baixos para os níveis mais altos.
loa-max-age=Idade máxima
loa-max-age.tooltip=Idade máxima em segundos para que este nível de autenticação seja válido. Se o nível específico for solicitado e o usuário já tiver sido autenticado com esse nível antes do período especificado de segundos atrás, ele não será solicitado a autenticar novamente. Mas se ele autenticou depois do período especificado de segundos atrás, ele precisará autenticar novamente com este nível novamente. O valor 0 na configuração significa que o usuário sempre será solicitado a se autenticar novamente com esse nível sempre que ele for solicitado.
