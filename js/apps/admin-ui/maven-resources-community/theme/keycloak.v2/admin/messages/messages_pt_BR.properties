includeInLightweight.tooltip=A reivindicação deve ser adicionada ao token de acesso leve?
lightweightAccessToken=Sempre use token de acesso leve
lightweightAccessTokenHelp=Se estiver Ativado, os tokens de acesso leves serão sempre usados. Se estiver desligado, eles não são usados por padrão, mas ainda é possível habilitá-los com o executor de políticas do cliente.
supportJwtClaimInIntrospectionResponse=Apoie a reivindicação JWT na resposta de introspecção
supportJwtClaimInIntrospectionResponseHelp=Se estiver Ativado, as solicitações de introspecção que usam o cabeçalho 'Accept: application/jwt' também conterão uma declaração chamada "jwt" com as declarações do resultado da introspecção codificadas como token de acesso JWT. Essa opção está obsoleta. Use a troca de tokens em vez desta funcionalidade.
allowTokenIntrospectionWithoutAudienceCheck=Permitir introspecção de token sem verificação de público
allowTokenIntrospectionWithoutAudienceCheckHelp=Permite que este cliente faça uma introspecção de tokens sem validação de público. Esta opção está obsoleta e será removida em alguma versão futura. Ative apenas a compatibilidade com versões anteriores durante a migração.
allowUserinfoWithLightweightAccessToken=Permitir UserInfo com token de acesso leve
allowUserinfoWithLightweightAccessTokenHelp=Permite que tokens de acesso leves emitidos por este cliente sejam usados com o endpoint UserInfo. Os tokens leves são projetados para introspecção de tokens. Esta opção está obsoleta e será removida em alguma versão futura. Ative apenas a compatibilidade com versões anteriores durante a migração.
ssfTransmitterEnabled=Transmissor SSF
ssfTransmitterEnabledHelp=Se ativado, esse realm atua como um Transmissor Shared Signals Framework (SSF) e expõe o endpoint de metadados de configuração SSF. A desativação de uma realm com fluxos ativos excluirá os eventos enfileirados para os receptores ao salvar; pause ou exclua os streams primeiro se quiser que os receptores sejam notificados por meio de um SET atualizado pelo stream antes de ficarem silenciosos.
ssfTransmitterDisableConfirmTitle=Desativar o transmissor SSF para este realm?
ssfTransmitterDisableConfirmIntro=Desativar o recurso Transmissor SSF para este realm tem os seguintes efeitos:
ssfTransmitterDisableConfirmBulletEndpoints=Todos os endpoints do Transmissor SSF (metadados, fluxos, assuntos, status, SSE) retornarão 404 aos receptores.
ssfTransmitterDisableConfirmBulletEvents=Nenhum novo evento de usuário ou administrador será registrado para receptores SSF neste realm.
ssfTransmitterDisableConfirmBulletDelivery=Todos os eventos enfileirados para receptores neste realm (PENDING e HELD) serão excluídos ao salvar. Eles não podem ser recuperados.
ssfTransmitterDisableConfirmBulletReceivers=Os receptores não são notificados de que os streams ficaram silenciosos. Eles simplesmente param de ver os eventos.
ssfTransmitterDisableConfirmRecommendation=Recomendado: pause ou exclua os streams SSF ativos neste realm antes de salvar, para que os destinatários recebam uma notificação adequada de atualização do stream antes que a entrega seja interrompida.
ssfTransmitterDisableConfirmContinue=Desativar transmissor
ssfTransmitterDisableEventsCleared=Os eventos SSF enfileirados para esta realm foram excluídos.
ssfTransmitterDisableEventsClearFailed=Falha ao excluir eventos SSF enfileirados para este realm
