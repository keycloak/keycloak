periodicFullSyncHelp=Se 'Importar usuários' estiver habilitado, uma tarefa periódica é iniciada para sincronizar usuários do LDAP para o Keycloak. Este tipo de sincronização busca todos os usuários do LDAP a cada execução, importando novos usuários ou atualizando os existentes. Se você tiver um grande número de usuários no LDAP, isso poderá ser ineficiente. Nesse caso, você pode desativar esta opção e usar 'Sincronização periódica de usuários alterados'.
periodicChangedUsersSyncHelp=Se 'Importar usuários' estiver habilitado, uma tarefa periódica será iniciada para sincronizar usuários do LDAP para o Keycloak com base nos carimbos de data e hora criados ou atualizados pela última vez. Este tipo de sincronização é mais eficiente que uma sincronização completa, especialmente se você tiver um grande número de usuários no LDAP. No entanto, requer que o servidor LDAP suporte a pesquisa usando os atributos 'createTimestamp' e 'modifyTimestamp' em predicados de consulta.
signatureAlgorithmHelp=O algoritmo de assinatura a ser usado para assinar documentos. Observe que os algoritmos baseados em 'SHA1' estão obsoletos e podem ser removidos no futuro. É recomendado seguir algum algoritmo mais seguro em vez de '*_SHA1'.
