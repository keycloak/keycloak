samlClientEncryptionDigestMethodHelp=Método Digest a ser usado quando qualquer algoritmo RSA-OAEP for selecionado como algoritmo de transporte de chave. Valor padrão SHA-256.
samlClientEncryptionMaskGenerationFunction=Função de geração de máscara
samlClientEncryptionMaskGenerationFunctionHelp=Função de geração de máscara a ser usada quando RSA-OAEP-11 for selecionado como algoritmo de transporte de chave. Valor padrão mgf1sha256.
openIdVerifiableCredentials=OpenID para credenciais verificáveis
openIdVerifiableCredentialsHelp=Esta seção é usada para definir configurações relacionadas ao OpenID para emissão de credenciais verificáveis (OID4VCI).
oid4vciEnabled=Habilitar OID4VCI
oid4vciEnabledHelp=Habilite esta opção para permitir que o cliente solicite credenciais verificáveis do endpoint de credencial OID4VCI do Keycloak.
oid4vciAttesterTrustIdps=Provedores de Identidade de confiança do atestador OID4VCI
oid4vciAttesterTrustIdpsHelp=Provedores de Identidade de material confiável contendo chaves públicas de atestadores confiáveis para validação de atestado de chave.
noAccessPolicies=Sem políticas de acesso
noAccessPoliciesInstructions=Ainda não foram configuradas políticas de acesso. Clique no botão abaixo para configurar a primeira política.
includeInOpenIdProviderMetadata=Incluir nos metadados do provedor OpenID
includeInOpenIdProviderMetadataHelp=Se ativado, esse escopo do cliente será incluído nos metadados do provedor OpenID.
interaction_required=Interação necessária
login_required=Login necessário
account_selection_required=Seleção de conta obrigatória
consent_required=É necessário consentimento
invalid_request_uri=Uri de solicitação inválido
invalid_request_object=Objeto de solicitação inválido
request_not_supported=Solicitação não suportada
request_uri_not_supported=Solicitação de uri não suportada
registration_not_supported=Registro não suportado
oid4vciAttributes=Atributos OID4VCI
oid4vciNonceLifetime=OID4VCI Nonce Lifetime
oid4vciNonceLifetimeHelp=A vida útil do nonce OID4VCI.
credentialOfferLifespan=Vida útil da oferta de credenciais
credentialOfferLifespanHelp=A vida útil padrão das ofertas de credenciais. Aplica-se ao código de autorização e aos fluxos de concessão de código pré-autorizado.
oid4vciFormValidationError=Certifique-se de que os campos do atributo OID4VCI sejam preenchidos com valores de 30 segundos ou mais.
signedMetadataLifespan=Vida útil dos metadados assinados
signedMetadataLifespanHelp=O tempo de vida dos metadados assinados. Após esse período, os metadados assinados expirarão.
signedMetadataSigningAlgorithm=Algoritmo de assinatura de metadados assinados
signedMetadataSigningAlgorithmHelp=O algoritmo usado para assinar os metadados do emissor. Isso garante a integridade e autenticidade dos metadados.
requireRequestEncryption=Exigir criptografia de solicitação
requireRequestEncryptionHelp=Se ativado, a criptografia será necessária para solicitações de credenciais além do TLS. As carteiras devem criptografar solicitações usando os metadados de criptografia de solicitação compatíveis.
requireResponseEncryption=Exigir criptografia de resposta
requireResponseEncryptionHelp=Se ativado, a criptografia será necessária para respostas de credenciais além do TLS. As carteiras devem fornecer chaves de criptografia na solicitação de credenciais.
enableDeflateCompression=Habilitar compactação DEF
enableDeflateCompressionHelp=Se ativado, o algoritmo de compactação DEF terá suporte para solicitações de credenciais. Isso permite que os clientes compactem suas solicitações para reduzir o tamanho da carga útil.
batchIssuanceSize=Tamanho de emissão do lote
batchIssuanceSizeHelp=O número máximo de credenciais que podem ser emitidas em uma única solicitação em lote. Isso ajuda a gerenciar a carga do servidor e os tempos de resposta.
timeClaimCorrelationMitigation=Mitigação de correlação de reivindicação de tempo
timeClaimsStrategy=Estratégia a ser aplicada a reivindicações de tempo
timeClaimsStrategyHelp=Estratégia a ser aplicada a reivindicações de tempo. Valores suportados: off, randomize, round.
randomizeWindow=Janela Randomizar
randomizeWindowHelp=Quando a estratégia é aleatória, subtraia um número aleatório de segundos entre 0 e o valor deste atributo do carimbo de data/hora original para mitigar ataques de correlação.
credentialConfigurationId=ID de configuração de credencial
credentialConfigurationIdHelp=O identificador exclusivo para esta configuração de credencial. Esse ID é usado nos metadados do emissor de credenciais e nas solicitações de credenciais.
credentialIdentifier=Identificador de Credencial
credentialIdentifierHelp=Um identificador específico para este tipo de credencial. Isso pode ser usado para distinguir entre diferentes variantes do mesmo tipo de credencial.
credentialOfferRequired=Oferta de credencial obrigatória
credentialOfferRequiredHelp=O Emissor exige uma oferta de credenciais para esta configuração de credenciais.
issuerDid=Emissor DID
issuerDidHelp=O Identificador Descentralizado (DID) do emissor da credencial. Isso identifica quem está emitindo as credenciais verificáveis.
credentialLifetime=Vida útil da credencial
credentialLifetimeHelp=A vida útil da credencial emitida. Após esse período, a credencial expirará e não poderá ser atualizada. A carteira pode atualizar a credencial para obter um novo VC, desde que esse tempo de vida não tenha sido excedido.
bindingRequired=Vinculação criptográfica necessária
bindingRequiredHelp=Se ativada, esta configuração de credencial requer vinculação do titular criptográfico e provas correspondentes. Se desativado, nenhuma ligação criptográfica será necessária e os metadados relacionados serão omitidos.
cryptographicBindingMethodsSupported=Métodos de ligação criptográfica
cryptographicBindingMethodsSupportedHelp=Lista separada por vírgulas de representações do material da chave criptográfica ao qual a credencial estará vinculada (por exemplo: jwk). Se estiver vazio, nenhum método de ligação criptográfica será anunciado.
cryptographicBindingMethodsSupportedInvalid=Método(s) de vinculação não suportado(s): {{invalid}}. Valores permitidos: jwk
bindingSupportedProofTypes=Tipos de prova suportados
bindingSupportedProofTypesHelp=Lista separada por vírgulas de tipos de prova aceitos quando a ligação criptográfica está habilitada (por exemplo: jwt). Se estiver vazio, nenhum tipo de prova será anunciado e as provas não serão aplicadas.
bindingSupportedProofTypesInvalid=Tipo(s) de prova não suportado(s): {{invalid}}. Valores permitidos: jwt, atestado
keyAttestationsRequiredHelp=Se habilitado, a carteira deverá fornecer um atestado de chave com seu comprovante. O requisito é anunciado para cada tipo de prova configurado.
keyAttestationKeyStorageHelp=Lista opcional separada por vírgula de níveis de resistência de armazenamento de chaves aceitos, por exemplo: iso_18045_moderate. Deixe ambos os campos de nível de resistência vazios para exigir um atestado chave sem restrições adicionais.
keyAttestationUserAuthentication=Níveis de resistência à autenticação do usuário
keyAttestationUserAuthenticationHelp=Lista opcional separada por vírgula de níveis de resistência de autenticação de usuário aceitos, por exemplo: iso_18045_moderate. Os valores de extensão definidos por um ecossistema são suportados.
supportedFormats=Formatos Suportados
supportedFormatsHelp=O formato da credencial verificável. Formatos atualmente suportados: SD-JWT VC (dc+sd-jwt), JWT VC (jwt_vc).
credentialRefreshInterval=Intervalo de atualização de credencial
credentialRefreshIntervalHelp=Com que frequência a carteira deve atualizar a credencial. O VC real retornado à carteira terá sua expiração definida para esse intervalo. O token de atualização permanece válido durante toda a vida útil da credencial, permitindo renovação regular. Se não for definido, o padrão será 7 dias ou o tempo de vida da credencial, o que for menor.
refreshIntervalCannotExceedLifetime=O intervalo de atualização da credencial ({{interval}}) não pode exceder o tempo de vida da credencial ({{lifetime}}). O token de atualização expira com o tempo de vida da credencial.
credentialDisplay=Exibição de credenciais
credentialDisplayHelp=Matriz JSON de objetos contendo metadados de exibição para carteiras (nome, logotipo, cores, etc.). Exemplo: [{"name": "IdentityCredential", "locale": "en-US", "logo": {"uri": "https://example.com/logo.png", "alt_text": "Logo"}, "background_color": "#12107c", "text_color": "#FFFFFF"}]
credentialSigningAlgorithm=Algoritmo de assinatura de credenciais
credentialSigningAlgorithmHelp=Algoritmo de assinatura usado para selecionar a chave de realm ativo para assinatura de credenciais (por exemplo, "ES256"). Se não for especificado, a chave ativa será selecionada usando o algoritmo padrão da realm. Esta opção é desativada se um 'ID de chave de assinatura' específico for selecionado.
hashAlgorithm=Algoritmo Hash
hashAlgorithmHelp=Algoritmo hash usado para credenciais SD-JWT (por exemplo "SHA-256"). O padrão é "SHA-256" se não for especificado.
supportedCredentialTypes=Tipos de credenciais compatíveis
supportedCredentialTypesHelp=Lista separada por vírgulas de tipos de credenciais (por exemplo, "VerifiableCredential,UniversityDegreeCredential"). Usado na definição de credenciais para formatos JWT VC e SD-JWT. Quando esta opção não estiver configurada, o nome do escopo do cliente será utilizado como declaração 'type' da credencial correspondente.
verifiableCredentialType=Tipo de credencial verificável (VCT)
verifiableCredentialTypeHelp=O identificador do tipo de credencial para credenciais no formato SD-JWT. Esse valor é usado na solicitação vct da credencial emitida. Obrigatório para o formato SD-JWT.
tokenJwsType=Tipo de token JWS
tokenJwsTypeHelp=O valor do tipo gravado no cabeçalho typ do JWT. Se estiver vazio, um padrão específico de formato será usado ("dc+sd-jwt" para SD-JWT VC e "vc+jwt" para JWT VC). Pode ser definido com valores personalizados, se exigido pela carteira ou sistema.
tokenJwsTypeFormatWarning=O tipo de token JWS configurado não corresponde ao valor recomendado para o formato de credencial selecionado. Valor recomendado: {{recommended}}.
visibleClaims=Reivindicações visíveis
visibleClaimsHelp=Lista separada por vírgulas de declarações que são sempre divulgadas no corpo do SD-JWT (por exemplo, "id,iat,nbf,exp,jti,given_name"). O padrão é "id,iat,nbf,exp,jti". Aplicável apenas ao formato SD-JWT.
signingKeyId=ID da chave de assinatura
signingKeyIdHelp=Opcional. O ID da chave de realm usada para assinar a credencial. Se não for especificado, a chave de assinatura ativa do realm do algoritmo especificado por 'Algoritmo de Assinatura de Credencial' (se definido) será usada automaticamente. Se uma chave específica for selecionada aqui, a opção 'Algoritmo de assinatura de credencial' será desabilitada e definida automaticamente para o algoritmo da chave.
useDefaultKey=Usar padrão (chave de assinatura ativa do realm)
useDefaultAlg=Usar algoritmo padrão
workflowsExplain=Os fluxos de trabalho capacitam os administradores a automatizar o gerenciamento de recursos de realm por meio de políticas baseadas em tempo ou em eventos.
createWorkflow=Criar fluxo de trabalho
workflowYAML=Fluxo de trabalho YAML
workflowYAMLHelp=A representação YAML do fluxo de trabalho.
emptyWorkflows=Sem fluxos de trabalho
emptyWorkflowsInstructions=Não há fluxos de trabalho neste realm. Crie um fluxo de trabalho para começar.
emptyUserWorkflowsInstructions=Não há fluxos de trabalho agendados para este usuário.
workflowCreated=O fluxo de trabalho foi criado.
workflowCreateError=Não foi possível criar o fluxo de trabalho: {{error}}
workflowDeleteConfirm=Excluir fluxo de trabalho?
workflowDeleteConfirmDialog=Esta ação excluirá permanentemente o fluxo de trabalho. Isto não pode ser desfeito.
workflowNameRequired=O nome do fluxo de trabalho é obrigatório.
workflowDeletedSuccess=O fluxo de trabalho foi excluído.
workflowDeleteError=Não foi possível excluir o fluxo de trabalho: {{error}}
updateWorkflow=Atualizar fluxo de trabalho
copyWorkflow=Copiar fluxo de trabalho
workflowDetails=Detalhes do fluxo de trabalho
updateWorkflowDetails=Atualmente, os fluxos de trabalho não podem ser editados, exceto para alterar o nome e ativar/desativar. Você pode copiar o fluxo de trabalho e editar a cópia.
copyWorkflowDetails=Você está prestes a criar um novo fluxo de trabalho baseado em um já existente.
createWorkflowDetails=Crie um novo fluxo de trabalho fornecendo sua representação JSON.
workflowEnabled=Fluxo de trabalho ativado
workflowDisabled=Fluxo de trabalho desativado
workflowUpdated=Fluxo de trabalho atualizado com sucesso
workflowUpdateError=Não foi possível atualizar o fluxo de trabalho: {{error}}
nextStep=Próxima etapa
scheduledAfter=Agendado depois
whichWorkflowsWillAppear=Quais fluxos de trabalho aparecerão nesta lista?
whichWorkflowsWillAppearDetail=Serão exibidos fluxos de trabalho para este usuário com pelo menos uma etapa pendente. Alguns fluxos de trabalho totalmente concluídos também poderão aparecer se o agendador ainda não os tiver limpo.
claimDisplayName=Nome de exibição
claimDisplayNamePlaceholder=por exemplo, endereço de e-mail
claimDisplayLocalePlaceholder=por exemplo, en, de, fr
addClaimDisplay=Adicionar entrada de exibição
removeClaimDisplay=Remover entrada de exibição
noClaimDisplayEntries=Nenhuma entrada de exibição. As entradas de exibição fornecem nomes de declarações fáceis de usar para diferentes localidades em aplicativos de carteira.
smtpConnectionTimeout=Tempo limite de conexão
smtpConnectionTimeoutHelp=O tempo limite em milissegundos para conexão com o servidor SMTP.
smtpSocketReadTimeout=Tempo limite de leitura do soquete
smtpSocketReadTimeoutHelp=O tempo limite em milissegundos para leitura do servidor SMTP.
smtpSocketWriteTimeout=Tempo limite de gravação do soquete
smtpSocketWriteTimeoutHelp=O tempo limite em milissegundos para gravação no servidor SMTP.
eventTypes.USER_SESSION_DELETED.name=Sessão do usuário excluída
eventTypes.USER_SESSION_DELETED.description=Sessão do usuário excluída
eventTypes.USER_SESSION_DELETED_ERROR.name=Erro de exclusão de sessão do usuário
eventTypes.USER_SESSION_DELETED_ERROR.description=Erro de exclusão de sessão do usuário
hideOnLoginWhenOrgNotResolved=Ocultar na página de login quando a organização não for resolvida
hideOnLoginWhenOrgNotResolvedHelp=Se ativado, o provedor de identidade ficará oculto na página de login quando a organização não puder ser resolvida com base no realm de email do usuário. Caso contrário, o provedor de identidade será mostrado na página de login, independentemente de a organização estar resolvida ou não. Se 'Ocultar na página de login' também estiver ativado, o provedor de identidade sempre estará oculto na página de login.
showOnLoginForUnlinkedMembers=Mostrar na página de login para membros desvinculados
showOnLoginForUnlinkedMembersHelp=Se ativado, esse provedor de identidade será mostrado aos membros da organização mesmo quando eles já estiverem vinculados a outro provedor de identidade.
theme.keycloak.v2.admin.description=Mais limpo e moderno, o v2 suporta a troca automática de modo claro/escuro. (Padrão para administrador)
role_realm-admin=Administrador do realm
