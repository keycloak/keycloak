ssfEmitSubjectValueHelp=Resolve para um usuário Keycloak (user-id / user-email / user-username) ou organização (org-alias). Para sujeitos de usuário, o transmissor constrói o sub_id usando o formato de assunto de usuário configurado do receptor para que o SET emitido corresponda ao formato de um evento nativo para este receptor; assuntos org emitem um assunto complexo somente para locatário. Os filtros de assinatura de assunto e as regras de falha em voz alta específicas do formato (sem e-mail, sem organização para +inquilino) ainda se aplicam.
ssfEmitSubjectValueRequired=Um valor de assunto é obrigatório.
ssfEmitPayload=Carga útil do evento (JSON)
ssfEmitPayloadHelp=Corpo específico do evento — deve desserializar em relação à classe do tipo de evento selecionado. Deixe em branco para emitir uma carga vazia (significativo apenas para tipos de eventos sem campos obrigatórios). Espaços reservados suportados (expandidos antes da análise JSON): __now__ resolve para o horário Unix atual em segundos. Utilizável sem aspas para campos numéricos, por ex. "event_timestamp": __now__.
ssfEmitPayloadInvalidJson=A carga útil não é JSON válida: {{error}}
ssfEmitEvent=Emitir evento
ssfEmitResult=Emitido — status={{status}}, jti={{jti}}
ssfEmitResultLookupLink=Procure este evento na Pesquisa de Eventos
ssfEmitErrorSubjectNotFound=Assunto não encontrado: {{type}} = {{value}}
ssfEmitErrorInvalidRequest=Solicitação inválida: {{detail}}
ssfEmitErrorNoDeliveryConfig=O stream não tem método de entrega configurado, portanto o evento não pode ser entregue. Configure primeiro a entrega push ou poll para o stream.
ssfEmitErrorUnknown=Falha na emissão: {{detail}}
ssfReceiverHelp=Política do lado do transmissor aplicada quando o Keycloak entrega tokens de eventos de segurança a este receptor.
ssfSectionGeneralHelp=Identidade, exibição e comportamento de fluxo para este receptor SSF: perfil e descrição, o público-alvo, para quais assuntos são entregues, formato do identificador de assunto, política de verificação e a janela de carência aplicada quando os receptores removem assuntos. Aplicado sempre que um stream é registrado ou atualizado para este cliente.
ssfSectionAuthenticationHelp=Regras de acesso que determinam quem pode gerenciar o fluxo SSF deste receptor e invocar o endpoint de emissão de evento sintético.
ssfSectionDelivery=Entrega
ssfSectionDeliveryHelp=Quais métodos de entrega este receptor pode usar e, quando a entrega push é permitida, os prefixos de URL para os quais o transmissor tem permissão para enviar tokens de eventos de segurança.
ssfSectionEventsHelp=Quais tipos de eventos este receptor anuncia e entrega, restrições de idade e inatividade que limitam a caixa de saída e se os administradores podem emitir eventos sintéticos para depuração ou integração de fluxo de trabalho.
ssfAllowedDeliveryMethods=Métodos de entrega permitidos
ssfAllowedDeliveryMethodsHelp=Quais métodos de entrega este receptor pode selecionar ao registrar um fluxo. Pelo menos um método deve estar habilitado. O receptor escolhe um dos métodos permitidos no momento da criação do fluxo; restringir esta lista apenas para pesquisa proíbe totalmente o transmissor de fazer chamadas HTTP de saída para este receptor.
ssfAllowedDeliveryMethods.push=Entrega push
ssfAllowedDeliveryMethods.pushHelp=O transmissor envia tokens de evento de segurança para um URL fornecido pelo receptor (RFC 8935). Requer que URLs de push válidos sejam configurados abaixo.
ssfAllowedDeliveryMethods.pollHelp=O receptor extrai tokens de evento de segurança enfileirados de um endpoint de pesquisa de propriedade do transmissor (RFC 8936). O URL do endpoint é gerado pelo Keycloak; nenhuma lista de permissões por receptor é necessária.
ssfValidPushUrls=URLs de envio válidos
ssfValidPushUrlsHelp=Lista de permissão de padrões de URL que o receptor pode registrar como seu endpoint push. Cada entrada é comparada com o URL fornecido pelo receptor usando correspondência exata ou curinga de sufixo final-* (por exemplo, https://receiver/push/* permite qualquer locatário + ID de fluxo nesse caminho). Uma URL fora da lista de permissões é rejeitada com HTTP 400 — esta é a defesa SSRF do receptor. Bare * não é honrado.
ssfValidPushUrls.add=Adicionar URL de envio válido
ssfReceiverEnabled=Receptor SSF
ssfReceiverEnabledHelp=Se habilitado, este cliente atua como um receptor Shared Signals Framework (SSF). Keycloak transmitirá eventos de segurança para este cliente de acordo com o fluxo SSF configurado.
ssfStream=Fluxo SSF
ssfStreamHelp=O stream registrado para este receptor e suas configurações de entrega de eventos.
ssfStreamNotRegistered=Nenhum fluxo SSF registrado ainda
ssfStreamNotRegisteredHelp=Este cliente receptor ainda não registrou um fluxo SSF com o transmissor. Você pode criar um em seu nome abaixo ou o próprio receptor pode criar um por meio da API do Transmissor SSF.
ssfCreateStream=Criar fluxo
ssfCreateStreamSuccess=Fluxo SSF criado com sucesso.
ssfCreateStreamError=Não foi possível criar o fluxo SSF: {{error}}
ssfCreateStreamDeliveryMethod=Método de entrega
ssfCreateStreamDeliveryMethodHelp=O método de entrega SSF a ser usado para esse fluxo. Push (RFC 8935) envia SETs assinados para um terminal hospedado no receptor; A pesquisa (RFC 8936) hospeda o terminal no transmissor e o receptor extrai SETs de acordo com sua própria programação. Push exige que o receptor forneça seu próprio URL de endpoint; A enquete usa um URL gerado pelo transmissor retornado na resposta de criação.
ssfCreateStreamEndpointUrl=Enviar URL do terminal
ssfCreateStreamEndpointUrlHelp=URL HTTPS no lado do receptor para onde o transmissor POSTARá tokens de eventos de segurança.
ssfCreateStreamEndpointUrlRequired=É necessário um URL de endpoint push.
ssfCreateStreamEndpointUrlInvalid=O URL do endpoint push deve ser um URL http ou https absoluto.
ssfCreateStreamEventsRequested=Eventos solicitados
ssfCreateStreamEventsRequestedHelp=Os tipos de eventos SSF nos quais o receptor deve estar inscrito. Escolha entre os eventos que o transmissor está configurado para emitir; deixe em branco para usar o conjunto padrão suportado pelo transmissor.
ssfCreateStreamDescriptionHelp=Rótulo legível opcional para o stream, exibido nesta interface de administração para operadores.
ssfStreamAudienceCurrentHelp=O público atualmente configurado no fluxo SSF registrado. A atualização do campo Stream Audience na seção SSF Receiver afeta apenas os streams que o receptor registra após a alteração.
ssfStreamPushEndpointUrl=Enviar URL do terminal
ssfStreamPushEndpointUrlHelp=URL HTTPS no lado do receptor para o qual o transmissor envia tokens de eventos de segurança. Mostrado apenas para streams que usam o método de entrega push HTTP.
ssfStreamPollEndpointUrl=URL do endpoint da pesquisa
ssfStreamPollEndpointUrlHelp=URL hospedada pelo transmissor para a qual o receptor faz POSTs para extrair tokens de eventos de segurança pendentes (RFC 8936). O receptor autentica com seu próprio token de portador; nenhum cabeçalho de autorização do lado do transmissor está configurado.
ssfStreamPushAuthHeader=Cabeçalho de autorização push
ssfStreamPushAuthHeaderHelp=Valor enviado no cabeçalho da solicitação de autorização em cada push (por exemplo, um token de portador) como está.
ssfDeleteStream=Excluir fluxo
ssfDeleteStreamConfirmTitle=Excluir fluxo SSF?
ssfDeleteStreamConfirmMessage=O fluxo SSF registrado para este cliente será excluído e o receptor terá que recriá-lo. Isto não pode ser desfeito. Continuar?
ssfDeleteStreamSuccess=Fluxo SSF excluído com sucesso.
ssfSubjects=Assuntos SSF
ssfSubjectsHelp=Gerencie sobre quais usuários ou organizações este receptor recebe eventos. Use Verificar para ver se um assunto está incluído no momento.
ssfSubjectType=Tipo de assunto
ssfSubjectTypeHelp=Como o valor abaixo é interpretado ao pesquisar o assunto. As opções do usuário são resolvidas para um usuário Keycloak por e-mail, ID ou nome de usuário; A organização (por alias) é resolvida para uma organização Keycloak. A preferência de notificação é armazenada como o atributo ssf.notify.${clientId} na entidade resolvida.
ssfSubjectType.userEmail=Usuário (por e-mail)
ssfSubjectType.userId=Usuário (por ID)
ssfSubjectType.userUsername=Usuário (por nome de usuário)
ssfSubjectType.orgAlias=Organização (por alias)
ssfSubjectValue=Valor do assunto
ssfSubjectAdd=Adicionar assunto
ssfSubjectRemove=Remover assunto
ssfSubjectStatusLabel=Status do assunto
ssfSubjectValueRequired=Insira um valor de assunto.
ssfSubjectNotFound=Assunto não encontrado. Verifique o valor e o tipo de assunto.
ssfSubjectIsNotified=Os eventos para este assunto são entregues neste stream.
ssfSubjectIsNotifiedViaOrg=O assunto é incluído por meio de uma associação de organização para este fluxo.
ssfSubjectIsNotifiedViaOrgNamed=O assunto está incluído por meio de associação à organização '{{org}}' para este stream.
ssfSubjectIsImplicitlyIncluded=O assunto está implicitamente incluído na entrega de eventos para este fluxo (default_subjects=ALL e sem exclusão explícita).
ssfSubjectIsNotNotified=O assunto não está incluído na entrega do evento para este stream.
ssfSubjectAdded=O assunto foi adicionado a este stream.
ssfSubjectIgnore=Ignorar assunto
ssfSubjectIgnored=O assunto foi ignorado para este stream.
ssfSubjectIsIgnored=O assunto está explicitamente excluído da entrega de eventos para este stream.
ssfSubjectIsIgnoredViaOrg=O assunto foi excluído por meio de uma associação de organização para este fluxo.
ssfSubjectIsIgnoredViaOrgNamed=O assunto foi excluído por ser membro da organização '{{org}}' deste stream.
ssfSubjectRemoved=O assunto foi removido deste stream.
ssfSubjectActionError=Não foi possível atualizar a preferência de notificação do assunto: {{error}}
ssfDeleteStreamError=Não foi possível excluir o fluxo SSF: {{error}}
ssfVerifyStreamSuccess=Evento de verificação despachado para o destinatário.
ssfVerifyStreamError=Não foi possível enviar o evento de verificação: {{error}}
ssfProfileHelp=O perfil Shared Signals Framework a ser usado ao transmitir eventos para este receptor.
ssfProfile.SSF_1_0=SSF 1.0
ssfProfile.SSE_CAEP=SSE CAEP 1.0
ssfCreateStreamProfileHelp=O perfil SSF aplicado a eventos enviados por esse stream. O perfil é uma configuração por receptor, portanto, alterá-lo aqui também atualiza o atributo de perfil dos clientes receptores antes que o fluxo seja criado.
ssfUserSubjectFormat=Formato do assunto
ssfUserSubjectFormatHelp=Formato de identificador de assunto que o transmissor usa para a parte do usuário dos Tokens de Evento de Segurança SSF. O padrão é iss_sub (emissor de realm + ID do usuário). Selecione email para emitir o endereço de email do usuário. As variantes +tenant envolvem o assunto do usuário em um assunto complexo e adicionam um irmão de locatário carregando o alias da organização Keycloak do usuário - use isso quando o receptor espera roteamento multilocatário. Os eventos são descartados (com uma entrada de log clara) quando o formato selecionado não pode ser produzido (por exemplo, email selecionado, mas o usuário não tem email ou +locatário selecionado, mas o usuário não pertence a nenhuma organização).
ssfUserSubjectFormat.iss_sub=iss_sub (Emissor e Assunto)
ssfUserSubjectFormat.complex.iss_sub+tenant=complexo(iss_sub + organização locatária)
ssfUserSubjectFormat.complex.email+tenant=complexo (e-mail + organização do locatário)
ssfDefaultSubjects=Assuntos padrão
ssfDefaultSubjectsHelp=Controla se o transmissor entrega eventos para todos os usuários da realm (TODOS) ou apenas para usuários adicionados explicitamente por meio do endpoint add-subject ou da guia Assuntos (NONE). Os receptores podem substituir isso por stream no momento da criação.
ssfDefaultSubjects.ALL=ALL (entregar eventos para todos os assuntos)
ssfDefaultSubjects.NONE=NENHUM (entregar apenas para assuntos adicionados)
ssfAutoNotifyOnLogin=Adicionar assunto no login
ssfAutoNotifyOnLoginHelp=Quando ativado e os Assuntos padrão estão definidos como NENHUMA, os usuários que fazem login por meio deste cliente são automaticamente adicionados ao conjunto de assuntos sobre os quais este receptor recebe eventos — equivalente a clicar em Adicionar para eles na guia Assuntos. Útil para cenários federados onde somente usuários autenticados por meio deste cliente devem ser incluídos na entrega de eventos.
ssfRequireServiceAccount=Exigir conta de serviço
ssfRequireServiceAccountHelp=Quando ativado, apenas a conta de serviço do próprio cliente pode acessar a API do transmissor SSF. Este é o comportamento padrão quando não definido explicitamente. Desabilite para clientes que usam o fluxo de código de autorização onde um usuário real se autentica e o back-end do receptor usa o token resultante para gerenciar seu fluxo SSF.
ssfRequiredRole=Função necessária
ssfRequiredRoleHelp=Quando definido, o usuário autenticado deve manter esta função (função de realm ou função de cliente neste cliente) para acessar a API do transmissor SSF. Verificado além do requisito de conta de serviço (se habilitado) e do requisito de escopo. Deixe em branco para ignorar a verificação de função.
ssfAllowEmitEvents=Emitir eventos ativados
ssfAllowEmitEventsHelp=Quando ativada, uma conta de serviço que mantém a função configurada abaixo pode enviar eventos SSF sintéticos para este receptor por meio do endpoint de emissão administrativa. Use isto para ambientes onde o Keycloak não pode observar eventos upstream nativamente (por exemplo, alterações de credenciais que acontecem no LDAP). Se nenhuma função estiver configurada, o endpoint será recusado. Os chamadores que têm permissão para gerenciar esse cliente ignoram a verificação de função.
ssfEmitEventsRole=Função de eventos de emissão obrigatória
ssfEmitEventsRoleHelp=Função que a conta de serviço de chamada deve ter para enviar eventos sintéticos. Selecione uma função de realm ou de cliente neste receptor. Aplica-se apenas quando "Eventos sintéticos" está ativado.
ssfMinVerificationInterval=Intervalo mínimo de verificação
ssfMinVerificationIntervalHelp=Quantidade mínima de tempo em segundos que deve passar entre as solicitações de verificação iniciadas pelo receptor para o fluxo deste cliente. As solicitações subsequentes nesta janela serão rejeitadas com HTTP 429. Deixe em branco para usar o padrão para todo o transmissor.
ssfMaxEventAge=Idade máxima do evento
ssfMaxEventAgeHelp=Duração máxima (em segundos) de eventos de caixa de saída pendentes, retidos ou de mensagens não entregues para este receptor. As linhas mais antigas são eliminadas pelo passe de manutenção do transmissor antes que a janela global de retenção de mensagens mortas seja aplicada. Use um valor curto para receptores cujos eventos perdem relevância rapidamente (por exemplo, sessão revogada). Deixe herdado para retornar apenas à retenção de todo o transmissor.
ssfInactivityTimeout=Tempo limite de inatividade
ssfInactivityTimeoutHelp=SSF 1.0 inactivity_timeout — se nenhuma atividade elegível do receptor (qualquer ocorrência na API de gerenciamento de fluxo ou uma pesquisa para fluxos POLL) chegar nesta janela, o transmissor pausará automaticamente o fluxo e enviará um evento atualizado de fluxo. A atividade é rastreada com granularidade de 5 minutos (gravação combinada para evitar sobrecarregar o armazenamento do cliente em pesquisas ocupadas), portanto, a verificação efetiva pode ser acionada com até 5 minutos de atraso – escolha tempos limite confortavelmente maiores que isso. Deixe em branco sem tempo limite.
ssfSubjectRemovalGrace=Graça de remoção de assunto
ssfAutoVerifyStream=Fluxo de verificação automática
ssfAutoVerifyStreamHelp=Quando ativado, o transmissor despacha automaticamente um SET de verificação de fluxo logo após o receptor criar um fluxo. Quando desabilitado, o receptor pode realizar a verificação enviando uma solicitação de verificação explícita ao endpoint de verificação.
ssfVerificationDelay=Atraso na verificação
ssfVerificationDelayHelp=Atraso em milissegundos antes que o transmissor envie o evento de verificação após a criação do fluxo. Aplica-se apenas quando a verificação automática do fluxo está ativada.
ssfStreamStatusHelp=Status atual do fluxo SSF deste cliente. Use os botões de ação abaixo para alterá-lo – eles passam pelo caminho de transição exigido pelas especificações do SSF, que despacha um SET atualizado por fluxo para o receptor e alinha o backlog da caixa de saída com o novo status.
ssfStreamStatusEnable=Ativar transmissão
ssfStreamStatusPause=Pausar transmissão
ssfStreamStatusDisable=Desativar transmissão
ssfStreamStatusUpdateSuccess=Status da transmissão atualizado. Um evento atualizado por fluxo foi enviado ao receptor.
ssfStreamStatusUpdateError=Não foi possível atualizar o status da transmissão: {{error}}
ssfStreamStatusLabel=Status da transmissão
ssfStreamIndicator.unregistered=Não registrado
ssfStreamStatusReason=Motivo do status
ssfStreamStatusReasonHelp=Motivo legível associado ao status atual do fluxo, se algum tiver sido fornecido quando o status foi alterado pela última vez (por exemplo, por um receptor pausando ou desativando o fluxo).
ssfDelivery=Método de entrega
ssfDeliveryHelp=O método de entrega que o transmissor usa para eventos neste stream. Push (RFC 8935) envia SETs assinados para o terminal do receptor; Poll (RFC 8936) mantém eventos na caixa de saída do transmissor até que o receptor os extraia através do endpoint de poll hospedado no transmissor.
ssfPushEndpointConnectTimeout=Tempo limite de conexão push
ssfPushEndpointConnectTimeoutHelp=Conecte o tempo limite em milissegundos ao entregar eventos SSF via push HTTP para o endpoint push do receptor.
ssfPushEndpointSocketTimeout=Tempo limite do soquete de envio
ssfPushEndpointSocketTimeoutHelp=Tempo limite de soquete (leitura) em milissegundos ao entregar eventos SSF via push HTTP para o endpoint push do receptor.
