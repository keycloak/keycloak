role_query-organizations=Consultar organizações
role_default-roles=Funções padrão
role_read-token=Ler token
role_offline-access=Acesso off-line
role_uma_authorization=Obtenha permissões
scimApiEnabled=API SCIM
scimApiEnabledHelp=Se ativado, expõe recursos de realm por meio de uma API baseada na especificação System for Cross-domain Identity Management (SCIM), ou seja, RFC7643 e RFC7644.
excludedDomains=Domínios excluídos
excludedDomainsHelp=Uma lista de domínios separados por vírgula para ignorar o redirecionamento automático. Você pode usar domínios curinga como `*.example.com` para excluir todos os subdomínios de `example.com`. Por exemplo, `*.example.com, example.com`.
clientScopesHelp=Escopos representam as operações que podem ser realizadas em um tipo de recurso (por exemplo, "visualizar" (view), "gerenciar" (manage) ou escopos específicos do recurso, como "gerenciar membros" (manage-members) para grupos). Cada escopo é independente, portanto, conceder "gerenciar" não concede automaticamente o escopo "visualizar". Selecione os escopos que se aplicam ao seu caso.
