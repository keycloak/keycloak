passwordPoliciesHelp.hashIterations=Die Anzahl der Hash-Durchläufe eines Passworts vor der Speicherung oder Überprüfung. Standard: -1, wenn argon2 als Hash-Algorithmus verwendet wird; 210.000, wenn pbkdf2-sha512 verwendet wird; 600.000, wenn pbkdf2-sha256 verwendet wird; 1.300.000, wenn pbkdf2 als Hash-Algorithmus verwendet wird.
