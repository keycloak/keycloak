optimizeLookupHelp=Soll beim Signieren von SAML-Dokumenten in der REDIRECT-Bindung für einen SP, der durch einen Keycloak-Adapter gesichert ist, die ID des Signaturschlüssels in der SAML-Protokollnachricht im Element <Extensions> enthalten sein? Dies optimiert die Validierung der Signatur, da die validierende Partei einen einzigen Schlüssel verwendet, anstatt jeden bekannten Schlüssel für die Validierung auszuprobieren.
