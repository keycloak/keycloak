ldapFullNameAttributeHelp=Name des LDAP-Attributs, das den vollständigen Namen (fullName) des Benutzers enthält. Normalerweise ist dies 'cn'.
clientRegisterPolicyDeleteConfirm=Sind Sie sicher, dass Sie die Client-Registrierungsrichtlinie {{name}} dauerhaft löschen möchten?
jsonEditor=JSON-Editor
mappingCreatedError=Zuordnung konnte nicht erstellt werden: '{{error}}'
deleteClientPolicyProfileConfirmTitle=Profil löschen?
passwordPoliciesHelp.forceExpiredPasswordChange=Die Anzahl der Tage, die das Passwort gültig ist, bevor ein neues Passwort erforderlich ist.
attributeConsumingServiceNameHelp=Name des Attribute Consuming Service Profil zum Bekanntmachen in der SP Metadaten.
singleLogoutServiceUrl=Single Logout Service URL
useRfc9068AccessTokenType=Verwende "at+jwt" als Access Token Header Typ
permissionPoliciesHelp=Definiert alle Policies, welche auf die Berechtigung angewendet werden müssen.
newRoleNameHelp=Der neue Rollenname. Das Format für den neuen Namen entspricht, wo im Access Token die Rolle zugeordnet wird. Das heisst, ein neuer Name mit 'myapp.newname' wird die Rolle an dieser Position im Access Token zuordnen. Ein neuer Name mit 'newname' wird die Rolle der Realm Rolle im Token zuordnen.
scopePermissions.clients.token-exchange-description=Richtlinien, die entscheiden, welchen Clients es erlaubt ist Tokens auszutauschen für ein Token, welches für diesen Client bestimmt ist.
executorTypeSwitchHelpText=Executor Type Switch Hilfetext
userInfoResponseEncryptionKeyManagementAlgorithm=Benutzer Info Antwort Verschlüsselungs-Schlüssel Management Algorithmus
