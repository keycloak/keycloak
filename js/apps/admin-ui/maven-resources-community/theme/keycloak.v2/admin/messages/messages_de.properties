lightweightAccessTokenHelp=Wenn aktiviert, werden immer Lightweight-Access-Token verwendet. Wenn deaktiviert, werden sie standardmäßig nicht verwendet, können aber weiterhin über einen Executor einer Client-Richtlinie aktiviert werden.
supportJwtClaimInIntrospectionResponse=JWT-Claim in der Introspection-Antwort unterstützen
supportJwtClaimInIntrospectionResponseHelp=Wenn aktiviert, enthalten Antworten auf Introspection-Anfragen mit dem Header 'Accept: application/jwt' auch einen Claim namens "jwt" mit den Claims des Introspection-Ergebnisses, kodiert als JWT-Access-Token. Dieser Schalter ist veraltet. Bitte verwenden Sie stattdessen Token Exchange.
allowTokenIntrospectionWithoutAudienceCheck=Token-Introspection ohne Audience-Prüfung erlauben
allowTokenIntrospectionWithoutAudienceCheckHelp=Erlaubt diesem Client, Token ohne Audience-Validierung zu introspektieren. Diese Option ist veraltet und wird in einer zukünftigen Version entfernt. Aktivieren Sie sie nur aus Gründen der Abwärtskompatibilität während der Migration.
allowUserinfoWithLightweightAccessToken=UserInfo mit Lightweight-Access-Token erlauben
allowUserinfoWithLightweightAccessTokenHelp=Erlaubt, dass von diesem Client ausgestellte Lightweight-Access-Token mit dem UserInfo-Endpunkt verwendet werden. Lightweight-Token sind für die Token-Introspection vorgesehen. Diese Option ist veraltet und wird in einer zukünftigen Version entfernt. Aktivieren Sie sie nur aus Gründen der Abwärtskompatibilität während der Migration.
ssf=SSF
ssfTransmitterEnabled=SSF-Transmitter
ssfTransmitterEnabledHelp=Wenn aktiviert, fungiert dieser Realm als Shared Signals Framework (SSF) Transmitter und stellt den Endpunkt für die SSF-Konfigurationsmetadaten bereit. Wenn Sie die Funktion für einen Realm mit aktiven Streams deaktivieren, werden beim Speichern die in der Warteschlange befindlichen Ereignisse für diese Receiver gelöscht; pausieren oder löschen Sie zuerst die Streams, wenn Receiver vor dem Verstummen über ein stream-updated-SET benachrichtigt werden sollen.
ssfTransmitterDisableConfirmTitle=SSF-Transmitter für diesen Realm deaktivieren?
ssfTransmitterDisableConfirmIntro=Das Deaktivieren der SSF-Transmitter-Funktion für diesen Realm hat folgende Auswirkungen:
ssfTransmitterDisableConfirmBulletEndpoints=Alle Endpunkte des SSF-Transmitters (Metadaten, Streams, Subjects, Status, SSE) geben für Receiver 404 zurück.
ssfTransmitterDisableConfirmBulletEvents=Für SSF-Receiver in diesem Realm werden keine neuen Benutzer- oder Admin-Ereignisse mehr aufgezeichnet.
ssfTransmitterDisableConfirmBulletDelivery=Alle in der Warteschlange befindlichen Ereignisse für Receiver in diesem Realm (PENDING und HELD) werden beim Speichern gelöscht. Sie können nicht wiederhergestellt werden.
ssfTransmitterDisableConfirmBulletReceivers=Receiver werden nicht darüber benachrichtigt, dass Streams verstummt sind. Sie erhalten einfach keine Ereignisse mehr.
ssfTransmitterDisableConfirmRecommendation=Empfehlung: Pausieren oder löschen Sie die aktiven SSF-Streams in diesem Realm vor dem Speichern, damit Receiver eine ordnungsgemäße stream-updated-Benachrichtigung erhalten, bevor die Zustellung endet.
ssfTransmitterDisableConfirmContinue=Transmitter deaktivieren
ssfTransmitterDisableEventsCleared=Die in der Warteschlange befindlichen SSF-Ereignisse für diesen Realm wurden gelöscht.
ssfTransmitterDisableEventsClearFailed=Die in der Warteschlange befindlichen SSF-Ereignisse für diesen Realm konnten nicht gelöscht werden
