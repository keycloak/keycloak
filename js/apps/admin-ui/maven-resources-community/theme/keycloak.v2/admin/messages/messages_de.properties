clientAccessType=Verwendet den Zugriffstyp des Clients (confidential, public, bearer-only), um zu bestimmen, ob die Richtlinie angewendet wird. Die Bedingung wird bei den meisten OpenID-Connect-Anfragen geprüft (Autorisierungsanfragen, Token-Anfragen, Anfragen an den Introspection-Endpunkt usw.). Bei vertraulichen Clients ist die Client-Authentifizierung aktiviert, bei öffentlichen Clients ist sie deaktiviert. Bearer-only ist ein veralteter Client-Typ.
searchScopeHelp=Bei einer Ebene gilt die Suche nur für Benutzer in den DNs, die durch User DNs angegeben sind. Bei einem Teilbaum gilt die Suche für den gesamten Teilbaum. Weitere Einzelheiten sind der LDAP-Dokumentation zu entnehmen.
