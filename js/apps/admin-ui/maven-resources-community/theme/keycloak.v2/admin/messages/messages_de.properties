ssfStreamManagedByHelp=Gibt an, ob dieser Stream vom SSF-Receiver über den Standard-Endpunkt /streams registriert oder von einem Keycloak-Administrator über die Admin-UI erstellt wurde. Wird bei der Erstellung festgelegt. Die Stream-Konfiguration (Beschreibung, angeforderte und zugestellte Ereignisse) kann hier nur für von Keycloak verwaltete Streams bearbeitet werden; für vom Receiver verwaltete Streams ist sie schreibgeschützt und wird vom Receiver geändert. Der Stream-Status (aktivieren, pausieren, deaktivieren) kann hier unabhängig davon, wer den Stream verwaltet, jederzeit geändert werden.
