jwtX509HeadersEnabledHelp=Wenn aktiviert, wird der Header x5t (X.509 Certificate SHA-1 Thumbprint) zum JWT hinzugefügt, um auf das zum Signieren verwendete Zertifikat zu verweisen. Andernfalls wird stattdessen der Header kid (Key ID) verwendet.
