modeHelp=LDAP_ONLY bedeutet, dass alle Gruppenzuordnungen von Benutzern aus LDAP abgerufen und in LDAP gespeichert werden. READ_ONLY ist ein schreibgeschützter LDAP-Modus, in dem Gruppenzuordnungen sowohl aus LDAP als auch aus der Datenbank abgerufen und zusammengeführt werden. Neue Gruppenbeitritte werden nicht in LDAP, sondern in der Datenbank gespeichert. IMPORT ist ein schreibgeschützter LDAP-Modus, in dem Gruppenzuordnungen aus LDAP abgerufen werden, wenn der Benutzer aus LDAP importiert wird, und anschließend in der lokalen Keycloak-Datenbank gespeichert werden.
