ssfEmitErrorUserSubjectMemberNotFound=Subject nicht gefunden: Das Benutzermitglied des komplexen Subjects konnte nicht aufgelöst werden.
ssfEmitErrorTenantSubjectMemberNotFound=Subject nicht gefunden: Das Tenant-Mitglied des komplexen Subjects konnte keiner Organisation zugeordnet werden.
ssfEmitErrorSubjectMismatch=Subject stimmt nicht überein: Das Benutzer-Subject ist kein Mitglied der Tenant-Organisation.
ssfEmitErrorInvalidRequest=Ungültige Anfrage: {{detail}}
ssfEmitErrorNoDeliveryConfig=Für den Stream ist keine Zustellmethode konfiguriert, daher kann das Ereignis nicht zugestellt werden. Konfigurieren Sie zuerst die Push- oder Poll-Zustellung für den Stream.
