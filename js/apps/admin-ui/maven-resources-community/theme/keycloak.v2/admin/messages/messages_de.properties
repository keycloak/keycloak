ssfLookupTitleHelp=Prüfen Sie den Zustellstatus eines bestimmten Security Event Tokens anhand seiner jti. Auf diesen Receiver beschränkt.
ssfEmitTitle=Synthetisches Ereignis senden
ssfEmitTitleHelp=Sendet ein synthetisches Ereignis per Push an diesen Receiver. Der Transmitter formatiert die sub_id gemäß dem konfigurierten Benutzer-Subject-Format des Receivers und wendet dieselben Abonnementfilter an wie bei nativen Ereignissen.
ssfEmitEventType=Ereignistyp
ssfEmitEventTypeHelp=Einer der Ereignistypen, die der Transmitter dieses Receivers senden kann. Die unten stehende Nutzlast wird gegen die für den ausgewählten Typ registrierte Ereignisklasse deserialisiert.
ssfEmitEventTypeSelectPrompt=-- Ereignistyp auswählen --
ssfEmitEventTypeRequired=Wählen Sie einen Ereignistyp zum Senden aus.
ssfEmitSubjectValueHelp=Wird zu einem Keycloak-Benutzer (user-id / user-email / user-username) oder einer Organisation (org-alias) aufgelöst. Bei Benutzer-Subjects erstellt der Transmitter die sub_id anhand des konfigurierten Benutzer-Subject-Formats des Receivers, sodass das gesendete SET der Form eines nativen Ereignisses für diesen Receiver entspricht; Organisations-Subjects senden ein komplexes, nur aus dem Tenant bestehendes Subject. Subject-Abonnementfilter und die formatspezifischen Fail-Loud-Regeln (keine E-Mail, keine Organisation für +tenant) gelten weiterhin.
ssfEmitSubjectValueRequired=Ein Subject-Wert ist erforderlich.
ssfEmitPayload=Ereignis-Nutzlast (JSON)
ssfEmitPayloadHelp=Ereignisspezifischer Inhalt – muss gegen die Klasse des ausgewählten Ereignistyps deserialisierbar sein. Leer lassen, um eine leere Nutzlast zu senden (nur sinnvoll für Ereignistypen ohne Pflichtfelder). Unterstützte Platzhalter (werden vor dem JSON-Parsing ersetzt): __now__ wird zur aktuellen Unix-Zeit in Sekunden aufgelöst. Kann für numerische Felder ohne Anführungszeichen verwendet werden, z. B. "event_timestamp": __now__.
ssfEmitPayloadInvalidJson=Die Nutzlast ist kein gültiges JSON: {{error}}
