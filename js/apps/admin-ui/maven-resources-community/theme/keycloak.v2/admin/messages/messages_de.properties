parameterizedScopeDisabledInfo=Dieser Scope wurde zuvor als parametrisiert konfiguriert, aber die Funktion Parametrisierte Scopes ist derzeit deaktiviert. Beim Speichern wird er in einen regulären Scope umgewandelt. Alternativ können Sie ihn entfernen.
