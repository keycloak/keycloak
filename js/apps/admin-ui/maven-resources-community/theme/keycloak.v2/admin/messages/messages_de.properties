supportsClientAssertionReuse=Erlaubt die Wiederverwendung von Client-Assertions
supportsClientAssertionReuseHelp=Standardmäßig kann eine Client-Assertion nicht mehrfach verwendet werden. Wenn der Client nicht für jede Anfrage eine neue Client-Assertion abrufen kann, kann diese Option aktiviert werden, um die Wiederverwendung derselben Client-Assertion zu erlauben.
