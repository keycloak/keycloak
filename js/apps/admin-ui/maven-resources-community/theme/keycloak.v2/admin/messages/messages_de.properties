ssfSectionGeneral=Allgemein
ssfSectionGeneralHelp=Identität, Anzeige und Stream-Verhalten für diesen SSF-Receiver: Profil und Beschreibung, die Ziel-Audience, für welche Subjects zugestellt wird, das Format der Subject-Kennung, die Verifizierungsrichtlinie und die Kulanzfrist, die gilt, wenn Receiver Subjects entfernen. Wird angewendet, wann immer ein Stream für diesen Client registriert oder aktualisiert wird.
ssfSectionAuthentication=Authentifizierung
ssfSectionAuthenticationHelp=Zugriffsregeln, die festlegen, wer den SSF-Stream dieses Receivers verwalten und den Endpunkt zum Senden synthetischer Ereignisse aufrufen darf.
ssfSectionDelivery=Zustellung
ssfSectionDeliveryHelp=Welche Zustellmethoden dieser Receiver verwenden darf und – wenn die Push-Zustellung erlaubt ist – die URL-Präfixe, an die der Transmitter Security Event Tokens per Push senden darf.
ssfSectionEvents=Ereignisse
ssfSectionEventsHelp=Welche Ereignistypen dieser Receiver ankündigt und zustellt, Alters- und Inaktivitätsbeschränkungen für die Outbox und ob Administratoren synthetische Ereignisse für Debugging oder Workflow-Integration senden dürfen.
ssfAllowedDeliveryMethods=Erlaubte Zustellmethoden
ssfAllowedDeliveryMethodsHelp=Welche Zustellmethoden dieser Receiver bei der Registrierung eines Streams auswählen darf. Mindestens eine Methode muss aktiviert sein. Der Receiver wählt beim Erstellen des Streams eine der erlaubten Methoden; wird diese Liste auf Poll beschränkt, darf der Transmitter überhaupt keine ausgehenden HTTP-Aufrufe an diesen Receiver durchführen.
ssfAllowedDeliveryMethods.push=Push-Zustellung
ssfAllowedDeliveryMethods.pushHelp=Der Transmitter sendet Security Event Tokens per POST an eine vom Receiver angegebene URL (RFC 8935). Erfordert, dass unten gültige Push-URLs konfiguriert sind.
ssfAllowedDeliveryMethods.poll=Poll-Zustellung
ssfAllowedDeliveryMethods.pollHelp=Der Receiver ruft Security Event Tokens aus der Warteschlange von einem Poll-Endpunkt des Transmitters ab (RFC 8936). Die Endpunkt-URL wird von Keycloak generiert; eine Allow-List pro Receiver ist nicht erforderlich.
ssfValidPushUrls=Gültige Push-URLs
ssfValidPushUrlsHelp=Allow-List mit URL-Mustern, die der Receiver als Push-Endpunkt registrieren darf. Jeder Eintrag wird mit der vom Receiver angegebenen URL per exakter Übereinstimmung oder per Suffix-Platzhalter mit abschließendem * verglichen (z. B. erlaubt https://receiver/push/* jede Tenant- und Stream-ID unter diesem Pfad). Eine URL außerhalb der Allow-List wird mit HTTP 400 abgelehnt – dies ist der SSRF-Schutz für Receiver. Ein alleinstehendes * wird nicht berücksichtigt.
ssfValidPushUrls.add=Gültige Push-URL hinzufügen
ssfReceiverEnabled=SSF-Receiver
ssfReceiverEnabledHelp=Wenn aktiviert, fungiert dieser Client als Shared Signals Framework (SSF) Receiver. Keycloak überträgt Sicherheitsereignisse gemäß dem konfigurierten SSF-Stream an diesen Client.
ssfStream=SSF-Stream
ssfStreamHelp=Der für diesen Receiver registrierte Stream und seine Einstellungen für die Ereigniszustellung.
ssfStreamNotRegistered=Noch kein SSF-Stream registriert
ssfStreamNotRegisteredHelp=Dieser Receiver-Client hat noch keinen SSF-Stream beim Transmitter registriert. Sie können unten in seinem Namen einen erstellen, oder der Receiver kann selbst einen über die API des SSF-Transmitters erstellen.
ssfCreateStream=Stream erstellen
ssfCreateStreamReset=Zurücksetzen
ssfCreateStreamSuccess=SSF-Stream erfolgreich erstellt.
ssfCreateStreamError=SSF-Stream konnte nicht erstellt werden: {{error}}
ssfCreateStreamDeliveryMethod=Zustellmethode
ssfCreateStreamDeliveryMethodHelp=Die SSF-Zustellmethode für diesen Stream. Push (RFC 8935) sendet signierte SETs an einen vom Receiver gehosteten Endpunkt; bei Poll (RFC 8936) wird der Endpunkt vom Transmitter gehostet, und der Receiver ruft SETs nach eigenem Zeitplan ab. Push erfordert, dass der Receiver seine eigene Endpunkt-URL angibt; Poll verwendet eine vom Transmitter generierte URL, die in der Antwort auf die Erstellung zurückgegeben wird.
ssfCreateStreamEndpointUrl=Push-Endpunkt-URL
ssfCreateStreamEndpointUrlHelp=HTTPS-URL auf Seiten des Receivers, an die der Transmitter Security Event Tokens per POST sendet.
ssfCreateStreamEndpointUrlRequired=Eine Push-Endpunkt-URL ist erforderlich.
ssfCreateStreamEndpointUrlInvalid=Die Push-Endpunkt-URL muss eine absolute http- oder https-URL sein.
ssfCreateStreamEventsRequested=Angeforderte Ereignisse
ssfCreateStreamEventsRequestedHelp=Die SSF-Ereignistypen, die der Receiver abonnieren soll. Wählen Sie aus den Ereignissen, für deren Versand der Transmitter konfiguriert ist; leer lassen, um die standardmäßig unterstützten Ereignisse des Transmitters zu verwenden.
ssfCreateStreamDescription=Beschreibung
ssfCreateStreamDescriptionHelp=Optionale, für Menschen lesbare Bezeichnung des Streams, die Betreibern in dieser Admin-UI angezeigt wird.
ssfStreamAudienceCurrentHelp=Die Audience, die derzeit für den registrierten SSF-Stream konfiguriert ist. Eine Änderung des Feldes 'Audience' im Abschnitt 'SSF-Receiver' wirkt sich nur auf Streams aus, die der Receiver nach der Änderung registriert.
ssfStreamPushEndpointUrl=Push-Endpunkt-URL
ssfStreamPushEndpointUrlHelp=HTTPS-URL auf Seiten des Receivers, an die der Transmitter Security Event Tokens per POST sendet. Wird nur für Streams angezeigt, die die HTTP-Push-Zustellung verwenden.
ssfStreamPollEndpointUrl=Poll-Endpunkt-URL
ssfStreamPollEndpointUrlHelp=Vom Transmitter gehostete URL, an die der Receiver POST-Anfragen sendet, um ausstehende Security Event Tokens abzurufen (RFC 8936). Der Receiver authentifiziert sich mit seinem eigenen Bearer-Token; auf Seiten des Transmitters ist kein Authorization-Header konfiguriert.
ssfStreamPushAuthHeader=Push-Authorization-Header
ssfStreamPushAuthHeaderHelp=Wert, der bei jedem Push unverändert im Request-Header Authorization gesendet wird (zum Beispiel ein Bearer-Token).
ssfDeleteStream=Stream löschen
ssfDeleteStreamConfirmTitle=SSF-Stream löschen?
ssfDeleteStreamConfirmMessage=Der registrierte SSF-Stream für diesen Client wird gelöscht, und der Receiver muss ihn neu erstellen. Dies kann nicht rückgängig gemacht werden. Fortfahren?
ssfDeleteStreamSuccess=SSF-Stream erfolgreich gelöscht.
ssfSubjects=SSF-Subjects
ssfSubjectsHelp=Verwalten Sie, über welche Benutzer oder Organisationen dieser Receiver Ereignisse erhält. Verwenden Sie 'Prüfen', um festzustellen, ob ein Subject derzeit einbezogen ist.
ssfSubjectType=Subject-Typ
ssfSubjectTypeHelp=Wie der unten stehende Wert bei der Suche nach dem Subject interpretiert wird. Benutzeroptionen werden über E-Mail, ID oder Benutzername zu einem Keycloak-Benutzer aufgelöst; Organisation (nach Alias) wird zu einer Keycloak-Organisation aufgelöst. Die Benachrichtigungseinstellung wird als Attribut ssf.notify.${clientId} an der aufgelösten Entität gespeichert.
ssfSubjectType.userEmail=Benutzer (nach E-Mail)
ssfSubjectType.userId=Benutzer (nach ID)
ssfSubjectType.userUsername=Benutzer (nach Benutzername)
ssfSubjectType.orgAlias=Organisation (nach Alias)
ssfSubjectValue=Subject-Wert
ssfSubjectAdd=Subject hinzufügen
ssfSubjectRemove=Subject entfernen
ssfSubjectCheck=Prüfen
ssfSubjectStatusLabel=Subject-Status
ssfSubjectValueRequired=Bitte geben Sie einen Subject-Wert ein.
ssfSubjectNotFound=Subject nicht gefunden. Überprüfen Sie den Wert und den Subject-Typ.
ssfSubjectIsNotified=Ereignisse für dieses Subject werden an diesen Stream zugestellt.
ssfSubjectIsNotifiedViaOrg=Das Subject ist über eine Organisationsmitgliedschaft in diesen Stream einbezogen.
ssfSubjectIsNotifiedViaOrgNamed=Das Subject ist über die Mitgliedschaft in der Organisation '{{org}}' in diesen Stream einbezogen.
ssfSubjectIsImplicitlyIncluded=Das Subject ist implizit in die Ereigniszustellung für diesen Stream einbezogen (default_subjects=ALL und kein expliziter Ausschluss).
ssfSubjectIsNotNotified=Das Subject ist nicht in die Ereigniszustellung für diesen Stream einbezogen.
ssfSubjectAdded=Das Subject wurde zu diesem Stream hinzugefügt.
ssfSubjectIgnore=Subject ignorieren
ssfSubjectIgnored=Das Subject wird für diesen Stream ignoriert.
ssfSubjectIsIgnored=Das Subject ist explizit von der Ereigniszustellung für diesen Stream ausgeschlossen.
ssfSubjectIsIgnoredViaOrg=Das Subject ist über eine Organisationsmitgliedschaft von diesem Stream ausgeschlossen.
ssfSubjectIsIgnoredViaOrgNamed=Das Subject ist über die Mitgliedschaft in der Organisation '{{org}}' von diesem Stream ausgeschlossen.
ssfSubjectRemoved=Das Subject wurde aus diesem Stream entfernt.
ssfSubjectActionError=Die Benachrichtigungseinstellung für das Subject konnte nicht aktualisiert werden: {{error}}
ssfDeleteStreamError=SSF-Stream konnte nicht gelöscht werden: {{error}}
ssfVerifyStream=Verifizieren
ssfVerifyStreamSuccess=Verifizierungsereignis an den Receiver gesendet.
ssfVerifyStreamError=Verifizierungsereignis konnte nicht gesendet werden: {{error}}
ssfProfile=Profil
ssfProfileHelp=Das Shared-Signals-Framework-Profil, das beim Übertragen von Ereignissen an diesen Receiver verwendet wird.
ssfProfile.SSF_1_0=SSF 1.0
ssfProfile.SSE_CAEP=SSE CAEP 1.0
ssfCreateStreamProfileHelp=Das SSF-Profil, das auf über diesen Stream gesendete Ereignisse angewendet wird. Das Profil ist eine Einstellung pro Receiver; eine Änderung hier aktualisiert daher vor dem Erstellen des Streams auch das Profilattribut des Receiver-Clients.
ssfUserSubjectFormat=Subject-Format
ssfUserSubjectFormatHelp=Format der Subject-Kennung, das der Transmitter für den Benutzerteil von SSF Security Event Tokens verwendet. Standard ist iss_sub (Realm-Issuer + Benutzer-ID). Wählen Sie email, um stattdessen die E-Mail-Adresse des Benutzers zu senden. Die +tenant-Varianten verpacken das Benutzer-Subject in ein komplexes Subject und fügen ein Tenant-Element hinzu, das den Alias der Keycloak-Organisation des Benutzers enthält – verwenden Sie dies, wenn der Receiver mandantenfähiges Routing erwartet. Ereignisse werden verworfen (mit einem eindeutigen Log-Eintrag), wenn das ausgewählte Format nicht erzeugt werden kann (z. B. wenn email ausgewählt ist, der Benutzer aber keine E-Mail-Adresse hat, oder wenn +tenant ausgewählt ist, der Benutzer aber keiner Organisation angehört).
ssfUserSubjectFormat.iss_sub=iss_sub (Issuer und Subject)
ssfUserSubjectFormat.email=email
ssfUserSubjectFormat.complex.iss_sub+tenant=complex(iss_sub + Tenant-Organisation)
ssfUserSubjectFormat.complex.email+tenant=complex(email + Tenant-Organisation)
ssfDefaultSubjects=Standard-Subjects
ssfDefaultSubjectsHelp=Legt fest, ob der Transmitter Ereignisse für alle Benutzer des Realms (ALL) oder nur für Benutzer zustellt, die explizit über den add-subject-Endpunkt oder die Registerkarte 'Subjects' hinzugefügt wurden (NONE). Receiver können dies beim Erstellen eines Streams pro Stream überschreiben.
ssfDefaultSubjects.ALL=ALL (Ereignisse für alle Subjects zustellen)
ssfDefaultSubjects.NONE=NONE (nur für hinzugefügte Subjects zustellen)
ssfAutoNotifyOnLogin=Subject bei Anmeldung hinzufügen
ssfAutoNotifyOnLoginHelp=Wenn aktiviert und 'Standard-Subjects' auf NONE gesetzt ist, werden Benutzer, die sich über diesen Client anmelden, automatisch zu den Subjects hinzugefügt, über die dieser Receiver Ereignisse erhält – so, als würde man in der Registerkarte 'Subjects' für sie auf 'Subject hinzufügen' klicken. Nützlich für föderierte Szenarien, in denen nur Benutzer, die sich über diesen Client authentifizieren, in die Ereigniszustellung einbezogen werden sollen.
ssfRequireServiceAccount=Dienstkonto erforderlich
ssfRequireServiceAccountHelp=Wenn aktiviert, kann nur das eigene Dienstkonto des Clients auf die API des SSF-Transmitters zugreifen. Dies ist das Standardverhalten, wenn nichts explizit festgelegt ist. Deaktivieren Sie diese Option für Clients, die den Authorization Code Flow verwenden, bei dem sich ein echter Benutzer authentifiziert und das Receiver-Backend das resultierende Token zur Verwaltung seines SSF-Streams verwendet.
ssfRequiredRole=Erforderliche Rolle
ssfRequiredRoleHelp=Wenn gesetzt, muss der authentifizierte Benutzer diese Rolle (Realm-Rolle oder Client-Rolle dieses Clients) besitzen, um auf die API des SSF-Transmitters zuzugreifen. Wird zusätzlich zur Dienstkonto-Anforderung (falls aktiviert) und zur Scope-Anforderung geprüft. Leer lassen, um die Rollenprüfung zu überspringen.
ssfAllowEmitEvents=Senden von Ereignissen aktiviert
ssfAllowEmitEventsHelp=Wenn aktiviert, kann ein Dienstkonto mit der unten konfigurierten Rolle über den Admin-Emit-Endpunkt synthetische SSF-Ereignisse für diesen Receiver senden. Verwenden Sie dies in Umgebungen, in denen Keycloak vorgelagerte Ereignisse nicht selbst beobachten kann (z. B. Änderungen von Zugangsdaten in LDAP). Ist keine Rolle konfiguriert, wird der Zugriff auf den Endpunkt verweigert. Aufrufer mit der Berechtigung, diesen Client zu verwalten, umgehen die Rollenprüfung.
ssfEmitEventsRole=Erforderliche Rolle zum Senden von Ereignissen
ssfEmitEventsRoleHelp=Rolle, die das aufrufende Dienstkonto besitzen muss, um synthetische Ereignisse zu senden. Wählen Sie eine Realm-Rolle oder eine Client-Rolle dieses Receivers. Gilt nur, wenn "Senden von Ereignissen aktiviert" eingeschaltet ist.
ssfMinVerificationInterval=Minimales Verifizierungsintervall
ssfMinVerificationIntervalHelp=Minimale Zeit in Sekunden, die zwischen vom Receiver initiierten Verifizierungsanfragen für den Stream dieses Clients vergehen muss. Weitere Anfragen innerhalb dieses Zeitfensters werden mit HTTP 429 abgelehnt. Leer lassen, um den Transmitter-weiten Standard zu verwenden.
ssfMaxEventAge=Maximales Ereignisalter
ssfMaxEventAgeHelp=Maximales Alter (in Sekunden) von ausstehenden, zurückgehaltenen oder Dead-Letter-Outbox-Ereignissen für diesen Receiver. Ältere Einträge werden vom Housekeeping des Transmitters gelöscht, bevor das globale Aufbewahrungsfenster für Dead Letters greift. Verwenden Sie einen kurzen Wert für Receiver, deren Ereignisse schnell an Relevanz verlieren (z. B. session-revoked). Lassen Sie den Wert geerbt, um nur auf die Transmitter-weite Aufbewahrung zurückzugreifen.
ssfInactivityTimeout=Inaktivitäts-Zeitlimit
ssfInactivityTimeoutHelp=SSF 1.0 inactivity_timeout – wenn innerhalb dieses Zeitfensters keine relevante Receiver-Aktivität eintrifft (ein beliebiger Aufruf der Stream-Management-API oder ein Poll bei POLL-Streams), pausiert der Transmitter den Stream automatisch und sendet ein stream-updated-Ereignis. Aktivität wird mit einer Granularität von 5 Minuten erfasst (Schreibvorgänge werden zusammengefasst, um den Client-Speicher bei aktiven Pollern nicht zu überlasten), sodass die Prüfung bis zu 5 Minuten verspätet greifen kann – wählen Sie Zeitlimits, die deutlich darüber liegen. Leer lassen für kein Zeitlimit.
ssfSubjectRemovalGrace=Kulanzfrist für das Entfernen von Subjects
ssfSubjectRemovalGraceHelp=SSF 1.0-Schutz gegen ‘Malicious Subject Removal’. Nach einem vom Receiver ausgelösten /streams/subjects/remove stellt der Transmitter für die angegebene Anzahl von Sekunden weiterhin Ereignisse für das Subject zu. Dies schützt davor, dass ein kompromittiertes Bearer-Token eines Receivers Ereignisse für ein Ziel unbemerkt unterdrückt. Von Administratoren ausgelöste Entfernungen werden immer sofort wirksam. Leer lassen, um den Transmitter-weiten SPI-Standard subject-removal-grace-seconds zu übernehmen; auf 0 setzen, um diesen Receiver von der Kulanzfrist auszunehmen, selbst wenn der Transmitter-Standard positiv ist (z. B. für Receiver, die Subjects berechtigterweise entfernen, wenn Benutzer ihren Dienst verlassen).
ssfAutoVerifyStream=Stream automatisch verifizieren
ssfAutoVerifyStreamHelp=Wenn aktiviert, sendet der Transmitter kurz nach der Erstellung eines Streams durch den Receiver automatisch ein SET zur Stream-Verifizierung. Wenn deaktiviert, kann der Receiver die Verifizierung durchführen, indem er eine explizite Verifizierungsanfrage an den Verifizierungs-Endpunkt sendet.
ssfVerificationDelay=Verifizierungsverzögerung
ssfVerificationDelayHelp=Verzögerung in Millisekunden, bevor der Transmitter nach der Erstellung des Streams das Verifizierungsereignis sendet. Gilt nur, wenn 'Stream automatisch verifizieren' aktiviert ist.
ssfStreamStatus=Status
ssfStreamStatusHelp=Aktueller Status des SSF-Streams für diesen Client. Verwenden Sie die Aktionsschaltflächen unten, um ihn zu ändern – diese durchlaufen den von der SSF-Spezifikation vorgeschriebenen Übergangspfad, der ein stream-updated-SET an den Receiver sendet und den Outbox-Rückstand an den neuen Status anpasst.
ssfStreamStatus.enabled=Aktiviert
ssfStreamStatus.paused=Pausiert
ssfStreamStatus.disabled=Deaktiviert
ssfStreamStatusEnable=Stream aktivieren
ssfStreamStatusPause=Stream pausieren
ssfStreamStatusDisable=Stream deaktivieren
ssfStreamStatusUpdateSuccess=Stream-Status aktualisiert. Ein stream-updated-Ereignis wurde an den Receiver gesendet.
ssfStreamStatusUpdateError=Stream-Status konnte nicht aktualisiert werden: {{error}}
