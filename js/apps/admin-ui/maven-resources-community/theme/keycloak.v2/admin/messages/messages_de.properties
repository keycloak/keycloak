oAuthDPoPHelp=Dies aktiviert die Unterstützung für an Demonstrating Proof-of-Possession (DPoP) gebundene Token. Bei öffentlichen Clients werden sowohl Access- als auch Refresh-Token an den auf dem Client gespeicherten Schlüssel gebunden. Um den Besitz des Schlüssels nachzuweisen, muss der Client zusammen mit dem Token einen signierten Nachweis senden. Bei vertraulichen Clients werden nur Access-Token an DPoP gebunden, da Refresh-Token gemäß der Spezifikation bereits durch die zugehörige Authentifizierungsanforderung an den Absender gebunden sind.
