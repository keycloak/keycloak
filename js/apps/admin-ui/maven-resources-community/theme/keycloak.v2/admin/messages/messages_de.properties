updateWorkflowDetails=Derzeit können Workflows nicht bearbeitet werden, außer um den Namen zu ändern und sie zu aktivieren oder zu deaktivieren. Sie können den Workflow kopieren und die Kopie bearbeiten.
copyWorkflowDetails=Sie sind dabei, einen neuen Workflow auf Basis eines vorhandenen zu erstellen.
createWorkflowDetails=Erstellen Sie einen neuen Workflow, indem Sie seine JSON-Darstellung angeben.
