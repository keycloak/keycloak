clientsClientTypeHelp='OpenID Connect' ermöglicht es Clients, die Identität des Endbenutzers anhand der von einem Autorisierungsserver durchgeführten Authentifizierung zu überprüfen. 'SAML' ermöglicht webbasierte Authentifizierungs- und Autorisierungsszenarien, einschließlich domänenübergreifendem Single Sign-On (SSO), und verwendet Sicherheitstoken mit Assertions zur Übermittlung von Informationen.
