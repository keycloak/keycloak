ssfStreamIndicator.unregistered=Nicht registriert
ssfStreamStatusReason=Statusgrund
ssfStreamStatusReasonHelp=Für Menschen lesbarer Grund für den aktuellen Stream-Status, sofern bei der letzten Statusänderung einer angegeben wurde (zum Beispiel, wenn ein Receiver den Stream pausiert oder deaktiviert hat).
ssfDelivery=Zustellmethode
ssfDeliveryHelp=Die Zustellmethode, die der Transmitter für Ereignisse dieses Streams verwendet. Push (RFC 8935) sendet signierte SETs an den Endpunkt des Receivers; Poll (RFC 8936) hält Ereignisse in der Outbox des Transmitters, bis der Receiver sie über den vom Transmitter gehosteten Poll-Endpunkt abruft.
ssfDelivery.PUSH=Push
ssfDelivery.POLL=Poll
ssfDelivery.PULL=Pull
ssfPushEndpointConnectTimeout=Push-Verbindungs-Zeitlimit
ssfPushEndpointConnectTimeoutHelp=Zeitlimit in Millisekunden für den Verbindungsaufbau beim Zustellen von SSF-Ereignissen per HTTP-Push an den Push-Endpunkt des Receivers.
ssfPushEndpointSocketTimeout=Push-Socket-Zeitlimit
ssfPushEndpointSocketTimeoutHelp=Socket-Zeitlimit (Lesen) in Millisekunden beim Zustellen von SSF-Ereignissen per HTTP-Push an den Push-Endpunkt des Receivers.
authenticatorRefConfig.maxAge.help=Das maximale Alter in Sekunden, für das der Authenticator-Referenzwert in einer SSO-Sitzung gültig ist. Wenn der Protokoll-Mapper für die Authentifizierungsmethoden-Referenz (AMR) verwendet wird, wird die AMR nur dann als gültig angesehen und in das Token eingetragen, wenn die Ausführung des Authenticators innerhalb des angegebenen Höchstalters abgeschlossen wurde.
