authenticatorRefConfig.maxAge.label=Authenticator-Referenz Maximales Alter
loa-condition-level=Authentifizierungsstufe (LoA)
loa-condition-level.tooltip=Authentifizierungsstufe. Dieser Wert sollte immer eine ganze Zahl größer oder gleich 0 sein. Die Unterabläufe im Authentifizierungsablauf sollten immer von den niedrigsten zu den höheren Stufen geordnet sein.
loa-max-age=Maximales Alter
loa-max-age.tooltip=Maximales Alter in Sekunden, für das diese Authentifizierungsstufe gültig ist. Wenn die betreffende Stufe angefordert wird und sich der Benutzer bereits vor weniger als der angegebenen Anzahl von Sekunden mit dieser Stufe authentifiziert hat, wird er nicht zur erneuten Authentifizierung aufgefordert. Liegt die Authentifizierung jedoch länger als die angegebene Anzahl von Sekunden zurück, muss er sich erneut mit dieser Stufe authentifizieren. Der Wert 0 in der Konfiguration bedeutet, dass sich der Benutzer immer erneut mit dieser Stufe authentifizieren muss, wenn diese Stufe angefordert wird.
includeInLightweight.label=Zum Lightweight-Access-Token hinzufügen
