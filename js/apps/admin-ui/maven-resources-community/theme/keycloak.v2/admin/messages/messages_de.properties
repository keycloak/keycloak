ssfStreamAudienceHelp=Audience-URI, die in Security Event Tokens eingetragen wird, die an diesen Receiver zugestellt werden. Wenn leer, verwendet der Transmitter einen generierten Wert der Form clientId/streamId, damit ein Receiver, der im Laufe der Zeit mehrere Streams registriert, diese bei der Übertragung unterscheiden kann.
