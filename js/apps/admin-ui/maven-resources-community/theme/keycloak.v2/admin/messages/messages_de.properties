targetAudience=Zielgruppe
targetAudienceHelp=Konfigurieren Sie die Ziel-Audience. Dies entspricht der Verwendung des Parameters 'audience' in der Grant-Anfrage an den Token-Endpunkt. Beachten Sie, dass der Parameter 'audience' derzeit nur für den Token-Exchange-Grant verfügbar ist. Um einen anderen Grant oder einen Token-Exchange-Grant ohne Parameter 'audience' zu simulieren, wird empfohlen, diesen Parameter leer zu lassen.
targetAudiencePlaceHolder=Zielgruppe für den Token-Austausch auswählen
permissionsEvaluationInstructions=Wählen Sie einen Benutzer aus, um zu prüfen, ob dieser einen bestimmten Zugriff auf die angegebene Ressource hat. Nach dem Klicken auf die Schaltfläche 'Auswerten' unten wird das Ergebnis im rechten Bereich angezeigt.
permissionEvaluationPreview=Vorschau der Berechtigungsauswertung
noPermissionsEvaluationResults=Keine Auswertung
noPermissionsEvaluationResultsInstructions=Bitte richten Sie die Berechtigungsauswertung auf der linken Seite ein
authScope=Autorisierungs-Scope
authScopeSelectHelp=Wählen Sie einen Autorisierungs-Scope aus, der für die Abfrage von Berechtigungen beim Server verwendet werden soll.
resourceTypeSelectHelp=Wählen Sie einen Ressourcentyp aus, der für die Abfrage von Berechtigungen beim Server verwendet werden soll.
