permissionDecisionStrategyHelp=Die Entscheidungsstrategie legt fest, wie die Richtlinien einer Berechtigung ausgewertet werden und wie eine endgültige Entscheidung getroffen wird. 'Zustimmung' bedeutet, dass mindestens eine Richtlinie positiv ausgewertet werden muss, damit auch die endgültige Entscheidung positiv ist. 'Einstimmig' bedeutet, dass alle Richtlinien positiv ausgewertet werden müssen, damit auch die endgültige Entscheidung positiv ist. 'Konsens' bedeutet, dass die Anzahl der positiven Entscheidungen größer sein muss als die Anzahl der negativen Entscheidungen. Ist die Anzahl der positiven und negativen Entscheidungen gleich, ist die endgültige Entscheidung negativ.
