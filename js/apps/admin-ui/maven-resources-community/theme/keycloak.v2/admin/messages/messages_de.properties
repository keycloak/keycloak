usernameLdapAttributeHelp=Name des LDAP-Attributs, das als Keycloak-Benutzername abgebildet wird. Bei vielen LDAP-Server-Anbietern kann dies 'uid' sein. Für Active Directory kann es 'sAMAccountName' oder 'cn' sein. Das Attribut sollte bei allen LDAP-Benutzerdatensätzen ausgefüllt sein, die von LDAP nach Keycloak importiert werden wollen.
federationLink=Föderierungslink
webAuthnPolicyPasswordlessFormHelp=Richtlinie für die passwortlose WebAuthn-Authentifizierung. Diese Richtlinie wird von der erforderlichen Aktion 'WebAuthn Register Passwordless' und dem Authenticator 'WebAuthn Passwordless Authenticator' verwendet. Ein typischer Anwendungsfall ist die Verwendung von WebAuthn als erster Faktor der Authentifizierung. Wenn sowohl die 'WebAuthn-Richtlinie' als auch die 'WebAuthn-Passwordless-Richtlinie' vorhanden sind, kann WebAuthn im selben Realm sowohl als Authenticator für den ersten als auch für den zweiten Faktor verwendet werden.
