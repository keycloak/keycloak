ssfEmitOnlyEventsHelp=Teilmenge der unterstützten Ereignisse, die Keycloak NICHT automatisch über native Ereignis-Listener senden soll. Hier aufgeführte Ereignisse werden weiterhin übertragen, wenn sie explizit über den synthetischen Emit-Endpunkt ausgelöst werden, werden aber von der automatischen Zuordnung von Keycloak übersprungen. Verwenden Sie dies, wenn ein Ereignistyp den Receiver nur bei Bedarf erreichen soll. Leer = jedes unterstützte Ereignis wird automatisch gesendet (Standard).
