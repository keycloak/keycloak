roleHelpHelp=Rolle, die dem Benutzer gewährt werden soll. Klicken Sie auf die Schaltfläche 'Rolle auswählen', um Rollen zu durchsuchen, oder geben Sie sie einfach in das Textfeld ein. Um eine Anwendungsrolle zu referenzieren, lautet die Syntax appname.approle, d. h. myapp.myrole.
storedTokensReadable=Gespeicherte Token lesbar
