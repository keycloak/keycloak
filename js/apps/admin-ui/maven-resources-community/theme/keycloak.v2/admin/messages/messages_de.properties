deleteConfirmRealm_other={{count}} Realms löschen?
recentRealms=Zuletzt verwendete Realms
manageRealms=Realms verwalten
cantDeleteMasterRealm=Sie können den Master-Realm nicht löschen!
clientScopesHelp=Scopes repräsentieren die Vorgänge, die für einen Ressourcentyp ausgeführt werden können (z. B. 'view', 'manage' oder ressourcenspezifische wie 'manage-members' für Gruppen). Jeder Scope ist unabhängig; das Gewähren von 'manage' gewährt also nicht automatisch 'view'. Wählen Sie die zutreffenden Scopes aus.
policyNameHelpText=Ein eindeutiger Name für die Richtlinie. Der Name darf nicht mit einem vorhandenen Richtlinien- oder Berechtigungsnamen kollidieren.
selectRole=Rolle auswählen
selectRoles=Rolle auswählen
selectUsers=Benutzer auswählen
selectClient=Client auswählen
forbiddenAdminConsole=Sie haben keine Berechtigung, auf diese Ressource zuzugreifen. Melden Sie sich mit einem Benutzer an, der über die Berechtigung verfügt, oder wenden Sie sich an Ihren Administrator.
grantedPermissions=Gewährte Berechtigungen
deniedPermissions=Verweigerte Berechtigungen
authenticationType=Authentifizierungstyp
authenticationTypeBasicAuth=Passwort
authenticationTypeTokenAuth=Token
authTokenUrl=Auth-Token-URL
tokenTokenUrlHelp=Token-Endpunkt zum Abrufen von Token, Keycloak-Beispiel: http://localhost/auth/realms/my-realm/protocol/openid-connect/token
authTokenScope=Auth-Token-Scope
authTokenScopeHelp=Durch Leerzeichen getrennte(r) Scope(s), die beim Abrufen des Tokens als Parameter scope verwendet werden, z. B. 'basic sendmail'
authTokenClientId=Auth-Token-Client-ID
authTokenClientIdHelp=Die client_id, die beim Abrufen des Tokens verwendet wird, z. B. mykeycloak-sendmail-client
authTokenClientSecret=Auth-Token-Client-Secret
enableDebugSMTP=SMTP-Debugging aktivieren
signatureMaxExp=Maximale Ablaufzeit
signatureMaxExpHelp=Maximal erlaubte Ablaufzeit für das JWT. Token müssen unmittelbar vor der Authentifizierung generiert werden. Nach diesem Zeitraum gelten sie als ungültig, weil sie zu alt sind. Wenn nicht festgelegt, beträgt der Standardwert 60 Sekunden.
fileNameDialogTitle=Speichern unter
fileName=Dateiname
themeName=Theme-Name
themeDescription=Theme-Beschreibung
themeDescriptionDefault=Benutzerdefiniertes Theme, erstellt mit der Theme-Schnellanpassung.
syncUsersStarted=Die Benutzersynchronisierung wurde gestartet.
userProfileClaims=Claims des Benutzerprofils
userIDClaim=ID-Claim
userIDClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der die eindeutige Kennung des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `sub` verwendet.
userNameClaim=Benutzername-Claim
userNameClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der den Benutzernamen des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `preferred_username` verwendet.
emailClaim=E-Mail-Claim
emailClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der die E-Mail-Adresse des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `email` verwendet.
fullNameClaim=Namens-Claim
fullNameClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der den vollständigen Namen des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `name` verwendet.
givenNameClaim=Vornamen-Claim
givenNameClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der den Vornamen des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `given_name` verwendet.
familyNameClaim=Nachnamen-Claim
familyNameClaimHelp=Der Name des Claims aus dem vom Benutzerprofil-Endpunkt zurückgegebenen JSON-Dokument, der den Nachnamen des Benutzers darstellt. Wenn nicht angegeben, wird standardmäßig `family_name` verwendet.
samlClientEncryptionAlgorithm=Verschlüsselungsalgorithmus
samlClientEncryptionAlgorithmHelp=Für den Client verwendeter Verschlüsselungsalgorithmus. Standard: AES_256_GCM.
samlClientKeyEncryptionAlgorithm=Schlüsseltransportalgorithmus
samlClientKeyEncryptionAlgorithmHelp=Für den Client verwendeter Schlüsseltransportalgorithmus, mit dem der für die Verschlüsselung verwendete geheime Schlüssel verschlüsselt wird. Standardwert: RSA-OAEP-11.
samlClientEncryptionDigestMethod=Digest-Methode für RSA-OAEP
samlClientEncryptionDigestMethodHelp=Digest-Methode, die verwendet wird, wenn ein RSA-OAEP-Algorithmus als Schlüsseltransportalgorithmus ausgewählt ist. Standardwert: SHA-256.
samlClientEncryptionMaskGenerationFunction=Maskengenerierungsfunktion
samlClientEncryptionMaskGenerationFunctionHelp=Maskengenerierungsfunktion, die verwendet wird, wenn RSA-OAEP-11 als Schlüsseltransportalgorithmus ausgewählt ist. Standardwert: mgf1sha256.
openIdVerifiableCredentials=OpenID for Verifiable Credentials
openIdVerifiableCredentialsHelp=Dieser Abschnitt dient der Konfiguration von Einstellungen für OpenID for Verifiable Credential Issuance (OID4VCI).
oid4vciEnabled=OID4VCI aktivieren
oid4vciEnabledHelp=Aktivieren Sie diese Option, damit der Client Verifiable Credentials vom OID4VCI-Credential-Endpunkt von Keycloak anfordern kann.
oid4vciAttesterTrustIdps=Vertrauenswürdige Identitätsanbieter für OID4VCI-Attester
oid4vciAttesterTrustIdpsHelp=Identitätsanbieter mit Vertrauensmaterial, die vertrauenswürdige öffentliche Schlüssel von Attestern für die Validierung der Schlüsselattestierung enthalten.
noAccessPolicies=Keine Zugriffsrichtlinien
noAccessPoliciesInstructions=Es wurden noch keine Zugriffsrichtlinien konfiguriert. Klicken Sie auf die Schaltfläche unten, um die erste Richtlinie zu konfigurieren.
includeInOpenIdProviderMetadata=In OpenID-Provider-Metadaten aufnehmen
includeInOpenIdProviderMetadataHelp=Wenn aktiviert, wird dieser Client-Scope in die OpenID-Provider-Metadaten aufgenommen.
