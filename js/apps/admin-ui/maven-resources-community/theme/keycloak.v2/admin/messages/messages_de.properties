unauthorized_client=Nicht autorisierter Client
access_denied=Zugriff verweigert
unsupported_response_type=Nicht unterstützter Response-Typ
invalid_scope=Ungültiger Scope
server_error=Serverfehler
temporarily_unavailable=Vorübergehend nicht verfügbar
interaction_required=Interaktion erforderlich
login_required=Anmeldung erforderlich
account_selection_required=Kontoauswahl erforderlich
consent_required=Einwilligung erforderlich
invalid_request_uri=Ungültige Request-URI
invalid_request_object=Ungültiges Request-Objekt
request_not_supported=Request nicht unterstützt
request_uri_not_supported=Request-URI nicht unterstützt
registration_not_supported=Registrierung nicht unterstützt
oid4vciAttributes=OID4VCI-Attribute
oid4vciNonceLifetime=OID4VCI-Nonce-Lebensdauer
oid4vciNonceLifetimeHelp=Die Lebensdauer der OID4VCI-Nonce.
credentialOfferLifespan=Lebensdauer des Credential Offers
credentialOfferLifespanHelp=Die Standard-Lebensdauer von Credential Offers. Gilt sowohl für den Authorization Code Flow als auch für den Pre-Authorized Code Flow.
oid4vciFormValidationError=Bitte stellen Sie sicher, dass die OID4VCI-Attributfelder Werte von 30 Sekunden oder mehr enthalten.
signedMetadataLifespan=Lebensdauer signierter Metadaten
signedMetadataLifespanHelp=Die Lebensdauer der signierten Metadaten. Nach dieser Zeit laufen die signierten Metadaten ab.
signedMetadataSigningAlgorithm=Signaturalgorithmus für signierte Metadaten
signedMetadataSigningAlgorithmHelp=Der Algorithmus, mit dem die Issuer-Metadaten signiert werden. Dies stellt die Integrität und Authentizität der Metadaten sicher.
requireRequestEncryption=Verschlüsselung der Anfrage erforderlich
requireRequestEncryptionHelp=Wenn aktiviert, ist für Credential-Anfragen zusätzlich zu TLS eine Verschlüsselung erforderlich. Wallets müssen Anfragen anhand der unterstützten Metadaten zur Anfrageverschlüsselung verschlüsseln.
requireResponseEncryption=Verschlüsselung der Antwort erforderlich
requireResponseEncryptionHelp=Wenn aktiviert, ist für Credential-Antworten zusätzlich zu TLS eine Verschlüsselung erforderlich. Wallets müssen in der Credential-Anfrage Verschlüsselungsschlüssel angeben.
enableDeflateCompression=DEF-Komprimierung aktivieren
enableDeflateCompressionHelp=Wenn aktiviert, wird der Komprimierungsalgorithmus DEF für Credential-Anfragen unterstützt. Dadurch können Clients ihre Anfragen komprimieren, um die Größe der Nutzlast zu verringern.
batchIssuanceSize=Batch-Ausstellungsgröße
batchIssuanceSizeHelp=Die maximale Anzahl von Credentials, die in einer einzelnen Batch-Anfrage ausgestellt werden können. Dies hilft, die Serverlast und die Antwortzeiten zu steuern.
issuerInfo=Issuer-Informationen
issuerInfoHelp=JSON-Array mit issuer_info-Elementen gemäß ETSI TS 119 472-3, Abschnitt 4.2.3. Jedes Element enthält die Member format und data. Beispiel: [{"format": "registration_cert", "data": "eyJhbGciOiJFUzI1NiJ9..."}].
issuerInfoInvalid=Muss ein gültiges JSON-Array mit issuer_info-Elementen sein.
timeClaimCorrelationMitigation=Schutz vor Korrelation über Zeit-Claims
timeClaimsStrategy=Strategie für Zeit-Claims
timeClaimsStrategyHelp=Strategie, die auf Zeit-Claims angewendet wird. Unterstützte Werte: off, randomize, round.
randomizeWindow=Randomisierungsfenster
randomizeWindowHelp=Bei der Strategie randomize wird vom ursprünglichen Zeitstempel eine zufällige Anzahl von Sekunden zwischen 0 und dem Wert dieses Attributs abgezogen, um Korrelationsangriffe zu erschweren.
roundUnit=Rundungseinheit
roundUnitHelp=Bei der Strategie round werden Zeitstempel auf die Grenze der ausgewählten Einheit (UTC) abgerundet. Unterstützte Werte: SECOND, MINUTE, HOUR, DAY.
randomize=Randomisieren
round=Runden
second=Sekunde
day=Tag
credentialConfigurationId=Credential-Konfigurations-ID
credentialConfigurationIdHelp=Die eindeutige Kennung dieser Credential-Konfiguration. Diese ID wird in den Credential-Issuer-Metadaten und in Credential-Anfragen verwendet.
credentialIdentifier=Credential-Kennung
credentialIdentifierHelp=Eine spezifische Kennung für diesen Credential-Typ. Sie kann verwendet werden, um verschiedene Varianten desselben Credential-Typs zu unterscheiden.
credentialOfferRequired=Credential Offer erforderlich
credentialOfferRequiredHelp=Der Issuer erfordert für diese Credential-Konfiguration ein Credential Offer.
issuerDid=Issuer-DID
issuerDidHelp=Der Decentralized Identifier (DID) des Credential-Issuers. Er gibt an, wer die Verifiable Credentials ausstellt.
credentialLifetime=Credential-Lebensdauer
credentialLifetimeHelp=Die Lebensdauer des ausgestellten Credentials. Nach dieser Zeit läuft das Credential ab und kann nicht mehr erneuert werden. Die Wallet kann das Credential erneuern, um ein neues VC zu erhalten, solange diese Lebensdauer nicht überschritten ist.
bindingRequired=Kryptografische Bindung erforderlich
bindingRequiredHelp=Wenn aktiviert, erfordert diese Credential-Konfiguration eine kryptografische Holder-Bindung und entsprechende Proofs. Wenn deaktiviert, ist keine kryptografische Bindung erforderlich, und zugehörige Metadaten werden weggelassen.
cryptographicBindingMethodsSupported=Methoden der kryptografischen Bindung
cryptographicBindingMethodsSupportedHelp=Kommagetrennte Liste von Darstellungen des kryptografischen Schlüsselmaterials, an das das Credential gebunden wird (zum Beispiel jwk für JWT/SD-JWT VC oder cose_key für ISO mDoc). Wenn leer, werden keine Methoden der kryptografischen Bindung angekündigt.
cryptographicBindingMethodsSupportedInvalid=Nicht unterstützte Bindungsmethode(n): {{invalid}}. Erlaubte Werte: {{allowed}}
bindingSupportedProofTypes=Unterstützte Proof-Typen
bindingSupportedProofTypesHelp=Kommagetrennte Liste von Proof-Typen, die akzeptiert werden, wenn die kryptografische Bindung aktiviert ist (zum Beispiel: jwt). Wenn leer, werden keine Proof-Typen angekündigt und Proofs nicht erzwungen.
bindingSupportedProofTypesInvalid=Nicht unterstützte(r) Proof-Typ(en): {{invalid}}. Erlaubte Werte: jwt, attestation
keyAttestationsRequired=Schlüsselattestierungen erforderlich
keyAttestationsRequiredHelp=Wenn aktiviert, muss die Wallet mit ihrem Proof eine Schlüsselattestierung bereitstellen. Die Anforderung wird für jeden konfigurierten Proof-Typ angekündigt.
keyAttestationKeyStorage=Resistenzstufen für die Schlüsselspeicherung
keyAttestationKeyStorageHelp=Optionale, kommagetrennte Liste akzeptierter Resistenzstufen für die Schlüsselspeicherung, zum Beispiel: iso_18045_moderate. Lassen Sie beide Felder für Resistenzstufen leer, um eine Schlüsselattestierung ohne zusätzliche Einschränkungen zu verlangen.
keyAttestationUserAuthentication=Resistenzstufen für die Benutzerauthentifizierung
keyAttestationUserAuthenticationHelp=Optionale, kommagetrennte Liste akzeptierter Resistenzstufen für die Benutzerauthentifizierung, zum Beispiel: iso_18045_moderate. Von einem Ökosystem definierte Erweiterungswerte werden unterstützt.
supportedFormats=Unterstützte Formate
supportedFormatsHelp=Das Format des Verifiable Credentials. Derzeit unterstützte Formate: SD-JWT VC (dc+sd-jwt), JWT VC (jwt_vc_json) und, falls aktiviert, ISO mDoc (mso_mdoc).
credentialRefreshInterval=Erneuerungsintervall für Credentials
credentialRefreshIntervalHelp=Wie oft die Wallet das Credential erneuern soll. Für das an die Wallet zurückgegebene VC wird die Ablaufzeit auf dieses Intervall gesetzt. Das Refresh-Token bleibt für die gesamte Credential-Lebensdauer gültig und ermöglicht so eine regelmäßige Erneuerung. Wenn nicht festgelegt, werden standardmäßig 7 Tage oder die Credential-Lebensdauer verwendet, je nachdem, welcher Wert kleiner ist.
refreshIntervalCannotExceedLifetime=Das Erneuerungsintervall für Credentials ({{interval}}) darf die Credential-Lebensdauer ({{lifetime}}) nicht überschreiten. Das Refresh-Token läuft mit der Credential-Lebensdauer ab.
credentialDisplay=Anzeige des Credentials
credentialDisplayHelp=JSON-Array mit Objekten, die Anzeigemetadaten für Wallets enthalten (Name, Logo, Farben usw.). Beispiel: [{"name": "IdentityCredential", "locale": "en-US", "logo": {"uri": "https://example.com/logo.png", "alt_text": "Logo"}, "background_color": "#12107c", "text_color": "#FFFFFF"}]
credentialSigningAlgorithm=Signaturalgorithmus für Credentials
credentialSigningAlgorithmHelp=Signaturalgorithmus, anhand dessen der aktive Realm-Schlüssel zum Signieren von Credentials ausgewählt wird (z. B. "ES256"). Wenn nicht angegeben, wird der aktive Schlüssel anhand des Standardalgorithmus des Realms ausgewählt. Diese Option ist deaktiviert, wenn eine bestimmte 'Signaturschlüssel-ID' ausgewählt ist.
hashAlgorithm=Hash-Algorithmus
hashAlgorithmHelp=Für SD-JWT-Credentials verwendeter Hash-Algorithmus (zum Beispiel "SHA-256"). Standardmäßig "SHA-256", wenn nicht angegeben.
supportedCredentialTypes=Unterstützte Credential-Typen
supportedCredentialTypesHelp=Kommagetrennte Liste von Credential-Typen (z. B. "VerifiableCredential,UniversityDegreeCredential"). Wird in der Credential-Definition für die Formate JWT VC und SD-JWT verwendet. Wenn diese Option nicht konfiguriert ist, wird der Name des Client-Scopes als Claim 'type' des entsprechenden Credentials verwendet.
verifiableCredentialType=Verifiable-Credential-Typ (VCT / DocType)
verifiableCredentialTypeHelp=Die Kennung des Credential-Typs für Credentials in den Formaten SD-JWT und ISO mDoc. Dieser Wert wird im Claim vct eines ausgestellten SD-JWT-Credentials und als doctype eines ausgestellten ISO-mDoc-Credentials verwendet. Erforderlich für die Formate SD-JWT und ISO mDoc.
tokenJwsType=JWS-Typ des Tokens
tokenJwsTypeHelp=Der Typwert, der in den Header typ des JWT geschrieben wird. Wenn leer, wird ein formatspezifischer Standardwert verwendet ("dc+sd-jwt" für SD-JWT VC und "vc+jwt" für JWT VC). Kann auf benutzerdefinierte Werte gesetzt werden, wenn die Wallet oder das System dies erfordert.
tokenJwsTypeFormatWarning=Der konfigurierte JWS-Typ des Tokens entspricht nicht dem empfohlenen Wert für das ausgewählte Credential-Format. Empfohlener Wert: {{recommended}}.
visibleClaims=Sichtbare Claims
visibleClaimsHelp=Kommagetrennte Liste von Claims, die im SD-JWT-Body immer offengelegt werden (z. B. "id,iat,nbf,exp,jti,given_name"). Standardwert ist "id,iat,nbf,exp,jti". Gilt nur für das Format SD-JWT.
signingKeyId=Signaturschlüssel-ID
signingKeyIdHelp=Optional. Die ID des Realm-Schlüssels, mit dem das Credential signiert wird. Wenn nicht angegeben, wird automatisch der aktive Signaturschlüssel des Realms für den unter 'Signaturalgorithmus für Credentials' angegebenen Algorithmus (falls gesetzt) verwendet. Wenn hier ein bestimmter Schlüssel ausgewählt wird, wird die Option 'Signaturalgorithmus für Credentials' deaktiviert und automatisch auf den Algorithmus des Schlüssels gesetzt.
useDefaultKey=Standard verwenden (aktiver Signaturschlüssel des Realms)
useDefaultAlg=Standardalgorithmus verwenden
