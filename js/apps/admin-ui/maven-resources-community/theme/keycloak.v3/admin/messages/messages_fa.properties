policyRolesHelp=برای افزودن نقش‌های پذیرفته‌شده به این سیاست، روی «افزودن نقش‌ها» کلیک کنید. علامت زدن کادر «فیلد الزامی» برای یک نقش به این معناست که آن نقش باید هنگام ارزیابی سیاست، صرف‌نظر از سایر نقش‌ها، حتماً وجود داشته باشد. علامت نزدن همهٔ نقش‌های مرتبط با سیاست، معادل تنظیم راهبرد تصمیم‌گیری روی «مثبت» (Affirmative) است.
wantAssertionsSignedHelp=مشخص می‌کند که آیا این ارائه‌دهندهٔ سرویس انتظار دریافت یک Assertion امضاشده را دارد یا خیر.
userInfoResponseEncryptionContentEncryptionAlgorithm=الگوریتم رمزنگاری محتوا برای رمزنگاری پاسخ اطلاعات کاربر
passLoginHint=ارسال login_hint
openIdConnectCompatibilityModesHelp=این بخش برای پیکربندی تنظیمات مربوط به سازگاری با نسخه‌های قدیمی‌تر آداپتورهای OpenID Connect / OAuth 2 استفاده می‌شود. این تنظیمات به‌ویژه زمانی مفید است که کلاینت شما از نسخهٔ قدیمی‌تری از آداپتور Keycloak / RH-SSO استفاده کند.
httpPostBindingAuthnRequestHelp=مشخص می‌کند که آیا AuthnRequest باید با استفاده از اتصال (binding) HTTP-POST ارسال شود یا خیر. در صورت غیرفعال بودن، از اتصال HTTP-REDIRECT استفاده خواهد شد.
userCredentialsHelpTextLabel=متن راهنمای اعتبارنامه‌های کاربر
applyToResourceTypeHelp=مشخص می‌کند که آیا این مجوز باید بر روی همهٔ منابعی که نوع مشخصی دارند اعمال شود یا خیر. در این حالت، این مجوز برای همهٔ نمونه‌های یک نوع منبع مشخص ارزیابی خواهد شد.
cibaIntervalHelp=حداقل مدت زمان (بر حسب ثانیه) که CD (دستگاه مصرف‌کننده) باید بین درخواست‌های سرکشی (polling) به نقطهٔ پایانی توکن صبر کند. اگر روی ۰ تنظیم شود، CD طبق مشخصات CIBA باید از مقدار پیش‌فرض ۵ استفاده کند.
updateCibaError=به‌روزرسانی سیاست CIBA ممکن نشد: {{error}}
clientDescriptionHelp=توضیحات کلاینت را مشخص می‌کند. برای مثال «کلاینت من برای برگه‌های ساعت کاری». از کلیدهای مقادیر محلی‌سازی‌شده نیز پشتیبانی می‌کند. برای مثال: ${my_client_description}.
rolesPermissionsHint=تعیین می‌کند که آیا مجوزهای دقیق (fine-grained) برای مدیریت این نقش فعال هستند یا خیر. غیرفعال کردن این گزینه، همهٔ مجوزهای فعلی که تنظیم شده‌اند را حذف خواهد کرد.
passwordPoliciesHelp.regexPattern=الزام می‌کند که گذرواژه با یک یا چند الگوی عبارت باقاعدهٔ (Regular Expression) جاوا که تعریف شده‌اند مطابقت داشته باشد.
oAuthDPoP=الزام توکن‌های متصل به DPoP
invalidRealmName=نام قلمرو نمی‌تواند شامل نویسه‌های خاص باشد
validRedirectURIsHelp=الگوی URI معتبری که مرورگر می‌تواند پس از ورود موفق به آن هدایت شود. استفاده از نویسه‌های عام (wildcard) ساده مانند 'http://example.com/' مجاز است. همچنین می‌توان مسیر نسبی مانند /my/relative/path/ را مشخص کرد. مسیرهای نسبی نسبت به URL ریشهٔ کلاینت در نظر گرفته می‌شوند، یا در صورتی که مشخص نشده باشد، از URL ریشهٔ سرور احراز هویت استفاده می‌شود. برای SAML، اگر به URL سرویس مصرف‌کننده (consumer service) که همراه با درخواست ورود ارسال می‌شود تکیه می‌کنید، باید الگوهای URI معتبر را تنظیم کنید.
subjectNameId=NameID موضوع
internationalizationHelp=در صورت فعال بودن، می‌توانید انتخاب کنید که این قلمرو از کدام زبان‌ها (locale) پشتیبانی کند و کدام زبان به‌عنوان پیش‌فرض باشد.
contextualAttributesHelp=هر ویژگی (attribute) که توسط محیط در حال اجرا یا زمینهٔ اجرا (execution context) فراهم می‌شود.
clientLoginTimeoutHelp=حداکثر زمانی که یک کلاینت برای تکمیل پروتکل توکن دسترسی در اختیار دارد. این مقدار معمولاً باید ۱ دقیقه باشد.
artifactBindingUrlHelp=URL برای ارسال پیام‌های HTTP ARTIFACT. اگر از اتصال (binding) دیگری استفاده می‌کنید، می‌توانید این فیلد را خالی بگذارید. این مقدار باید زمانی تنظیم شود که اتصال ARTIFACT همراه با ورود آغازشده توسط IdP اجباری شده باشد.
eventTypes.VALIDATE_ACCESS_TOKEN.description=اعتبارسنجی توکن دسترسی
dedicatedScopeExplain=این یک دامنهٔ کلاینت (client scope) است که شامل نگاشت‌گرها (mappers) و دامنهٔ اختصاصی می‌شود
