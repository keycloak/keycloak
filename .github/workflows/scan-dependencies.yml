name: Scan dependencies
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  define-refs:
    if: github.event_name != 'schedule' || github.repository == 'keycloak/keycloak'
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        run: |
          BRANCHES=($(gh api --cache 1h --paginate /repos/${{ github.repository }}/branches -q '.[] | .name | select(startswith("release"))' | sort -V -r))
          LATEST_REL_BRANCH=$(echo ${BRANCHES[0]} | sed 's|release/||') 
          TAGS=($(gh api --cache 1h /repos/${{ github.repository }}/tags --paginate -q ".[] | .name | select(startswith(\"$LATEST_REL_BRANCH\"))" | sort -V -r))
          LATEST_TAG=$(echo ${TAGS[0]}) 
          
          REFS='['
          REFS+="\"refs/heads/main\""
          for BRANCH in "${BRANCHES[@]}"; do
              REFS+=", "
              REFS+="\"refs/heads/$BRANCH\""
          done

          if [ "$LATEST_TAG" != "" ]; then 
            REFS+=", \"refs/tags/$LATEST_TAG\""
          fi
          
          REFS+=']'

          echo "refs=$REFS" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scan-dependencies:
    name: Scan dependencies
    runs-on: ubuntu-latest
    needs: define-refs
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        ref: ${{ fromJSON(needs.define-refs.outputs.refs) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - name: Get head commit
        run: echo "CURRENT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV
      - name: Trivy setup
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true
          version: v0.70.0 # There's an issue in v0.71.0 that makes it not work with Keycloak
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Resolve Maven dependencies
        run: |
          ./mvnw dependency:tree -DskipTestsuite -DexcludeGroupIds=org.keycloak
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivyignores: .trivy/trivyignore.yaml
          format: 'json'
          output: 'trivy-report.json'
          scanners: 'vuln'          
          skip-setup-trivy: true
      - name: Display report
        run: |
          cat trivy-report.json | jq -r '"| ID | PKG | INSTALLED | FIXED | SEVERITY |", "| -- | -- | -- | -- | -- |", ([.Results[] | select(.Vulnerabilities != null) | .Vulnerabilities[]] | unique_by(.VulnerabilityID) | .[] | "| \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.Severity) |")' >> $GITHUB_STEP_SUMMARY
      - name: Convert to sarif
        run: |
          trivy convert --format sarif -o trivy-report.sarif --scanners vuln trivy-report.json
      - name: Upload report
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-report.sarif'
          category: 'dependencies'
          ref: ${{ matrix.ref }}
          sha: ${{ env.CURRENT_SHA }}
      - run: echo "TRIVY_ARTIFACT_NAME=$(echo 'trivy-report-${{ matrix.ref }}' | sed 's|/|_|g')" >> $GITHUB_ENV

      - name: Upload Report to Run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TRIVY_ARTIFACT_NAME }}
          path: trivy-report.json
          retention-days: 30
