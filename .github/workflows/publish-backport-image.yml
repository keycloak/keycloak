name: Publish backport image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. 26.6.6, or 26.6.4-INFORM-1 for a backport)'
        required: true
        type: string
      image-tag:
        description: 'Image tag override (defaults to the tag input; also sets the image version label)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  MAVEN_ARGS: "-B -nsu -Daether.connector.http.connectionMaxTtl=25"

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish backport image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      # github.sha is the SHA of the ref this run was dispatched on (normally main), NOT the
      # tag checked out above, so it must not be used for provenance labels.
      - name: Resolve build metadata
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: ./.github/actions/java-setup

      - name: Maven cache
        uses: ./.github/actions/maven-cache
        with:
          create-cache-if-it-doesnt-exist: true

      # Deliberately inlined instead of ./.github/actions/build-keycloak. Local actions resolve
      # against the CHECKED-OUT TAG, not main. That is wanted for java-setup (JDK 17 on 22.0.2+,
      # 21 on 26.0-26.5, 25 on 26.6+; absent entirely before 22.0.2), but build-keycloak churned
      # across releases: the copy on 22.0.3-INFORM-1 uses the retired actions/upload-artifact@v3
      # and a different mvnw line. Keeping the recipe here means every tag builds the same way.
      # For the same reason, do not add ./.github/actions/pnpm-store-cache: it does not exist
      # before 26.0.6, and a missing local action is a fatal step error.
      - name: Build Keycloak
        run: |
          ./mvnw install -Pdistribution -am -pl distribution/maven-plugins/licenses-processor
          ./mvnw install dependency:resolve -V -e -DskipTests -DskipExamples \
            -DexcludeGroupIds=org.keycloak -Dsilent=true -DcommitProtoLockChanges=true

      - name: Package distribution
        run: ./mvnw package -pl quarkus/server/,quarkus/dist/

      - name: Copy distribution to container build context
        run: cp quarkus/dist/target/keycloak-*.tar.gz quarkus/container/keycloak.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image-name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: quarkus/container
          push: true
          build-args: |
            KEYCLOAK_VERSION=${{ inputs.image-tag || inputs.tag }}
            KEYCLOAK_DIST=keycloak.tar.gz
            KEYCLOAK_SOURCE=https://github.com/${{ github.repository }}
          tags: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.name }}:${{ inputs.image-tag || inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.image-tag || inputs.tag }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
