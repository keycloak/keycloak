name: Weblate Sync

on:
  # Update Weblate once a day, and if a translation file (source or target) changes.
  # Using this workflow prevents Weblate to rebase its PRs on every commit in Keycloak's main branch.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'themes/**/messages_*.properties'
      - 'js/**/messages_*.properties'

defaults:
  run:
    shell: bash

concurrency:
  # Only cancel jobs for PR updates
  group: weblate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  
jobs:
  update-weblate:
    name: Trigger Weblate to pull the latest changes
    runs-on: ubuntu-latest

    steps:
      # language=bash
      - run: |
          if [ "${WEBLATE_TOKEN}" != "" ]; then
            # Weblate returns HTTP 423 while another repository operation is still running, so retry
            for operation in pull push; do
              curl --fail-with-body --retry 10 --retry-delay 30 --retry-all-errors -d operation=${operation} -H "Authorization: Token ${WEBLATE_TOKEN}" https://hosted.weblate.org/api/projects/keycloak/repository/
            done
          fi

        env:
          WEBLATE_TOKEN: ${{ secrets.WEBLATE_TOKEN }}