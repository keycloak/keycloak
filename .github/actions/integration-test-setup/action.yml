name: Setup integration test
description: Download Maven caches needed for integration tests

inputs:
  jdk-dist:
    description: JDK distribution
    required: false
    default: temurin
  jdk-version:
    description: JDK version
    required: false
    default: "25"
  download-dist:
    description: Download the Keycloak distribution tar.gz built by the build job into quarkus/dist/target
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - id: update-hosts
      name: Update /etc/hosts
      uses: ./.github/actions/update-hosts

    - id: setup-java
      name: Setup Java
      uses: ./.github/actions/java-setup
      with:
        distribution: ${{ inputs.jdk-dist }}
        java-version: ${{ inputs.jdk-version }}

    - id: maven-cache
      name: Maven cache
      uses: ./.github/actions/maven-cache

    - id: pnpm-store-cache
      name: PNPM store cache
      uses: ./.github/actions/pnpm-store-cache

    - id: download-keycloak
      name: Download Keycloak Maven artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: m2-keycloak.tzts

    - id: extract-maven-artifacts
      name: Extract Keycloak Maven artifacts
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          # zstd binary might be missing in older versions, install only when necessary
          which zstd > /dev/null || choco install zstandard
        fi
        tar -C ~/ --use-compress-program="zstd -d" -xf m2-keycloak.tzts

    - id: download-keycloak-dist
      name: Download Keycloak distribution
      if: inputs.download-dist == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: keycloak-dist
        path: quarkus/dist/target
