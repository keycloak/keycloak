name: Store IT
description: Run Store integration tests

inputs:
  db:
    description: The database to use for tests
    required: true

runs:
  using: composite
  steps:
    - id: integration-test-setup
      name: Integration test setup
      uses: ./.github/actions/integration-test-setup

    - name: Run new base tests
      shell: bash
      run: |
        KC_TEST_DATABASE=${{ inputs.db }} KC_TEST_DATABASE_REUSE=true TESTCONTAINERS_REUSE_ENABLE=true ./mvnw package -f tests/pom.xml -Dtest=DatabaseTestSuite -Dkc.test.server.start.timeout=360

    - name: Database container port
      shell: bash
      run: |
        # The Ryuk container process exists temporarily after the JVM terminates, wait for only the database container to remain
        while [ "$(docker ps -q | wc -l)" -ne 1 ]; do
          docker ps
          sleep 10
        done
        DATABASE_PORT=$(docker ps -l --format '{{ .ID }}' | xargs docker port | cut -d ':' -f 2)
        echo "DATABASE_PORT=$DATABASE_PORT" >> $GITHUB_ENV 

    - name: Run stateless tests
      shell: bash
      run: |
        KC_TEST_DATABASE=${{ inputs.db }} KC_TEST_DATABASE_REUSE=true TESTCONTAINERS_REUSE_ENABLE=true ./mvnw package -f tests/pom.xml -Dtest=StatelessTestSuite -Dkc.test.server.start.timeout=360

    - uses: ./.github/actions/upload-flaky-tests
      name: Upload flaky tests
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        job-name: Store IT
