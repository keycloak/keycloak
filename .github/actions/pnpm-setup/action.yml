name: Setup PNPM
description: Sets up Node.js, enables Wireit and PNPM caching, and installs dependencies.

runs:
  using: composite
  steps:
    # Wireit includes the Node.js version in its cache fingerprint, so using the same version as the Maven build lets both share cache entries.
    - name: Get Node.js version
      id: node-version
      shell: bash
      run: echo "version=$(grep '<node.version>' js/pom.xml | cut -d '>' -f 2 | cut -d '<' -f 1 | cut -c 2-)" >> $GITHUB_OUTPUT

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}

    - name: Setup Corepack
      uses: ./.github/actions/corepack-setup

    - name: PNPM store cache
      uses: ./.github/actions/pnpm-store-cache

    - name: Install dependencies
      shell: bash
      run: pnpm install --prefer-offline --frozen-lockfile
      working-directory: js
